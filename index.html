function pathDone(){ return pathSteps().filter(x=>x.done).length; }
/* Номер текущего шага — это первый непройденный, а не количество пройденных:
   иначе при пропуске шага номер и подпись под ним расходятся. */
function pathCurrent(){ const i = pathSteps().findIndex(x=>!x.done); return i === -1 ? null : i; }
function pathNext(){ const i = pathCurrent(); return i === null ? 'Все шаги пройдены — дальше только чтение и практика' : pathSteps()[i].t; }

function renderPath(){
  const steps = pathSteps();
  const doneCount = steps.filter(s=>s.done).length;
  const current = steps.findIndex(s=>!s.done);
  return `
  <button class="btn ghost back" onclick="go('home')">← на главную</button>
  <h1>Путь</h1>
  <p class="lead">Порядок, в котором стоит идти. Он не обязательный — но если непонятно, за что браться, берись за ближайший невыполненный шаг.</p>
  <div class="row" style="justify-content:space-between;margin-bottom:var(--s2)">
    <span class="tiny">Пройдено шагов</span><span class="tiny num">${doneCount} из ${steps.length}</span>
  </div>
  <div class="bar" style="margin-bottom:var(--s6)"><i style="width:${Math.round(doneCount/steps.length*100)}%"></i></div>

  <div class="path">
    ${steps.map((s,i)=>`
      <div class="pstep ${s.done?'done':''} ${i===current?'now':''}">
        <div class="pmark">${s.done?'✓':i+1}</div>
        <div class="pbody">
          <div class="ptitle">${esc(s.t)}${i===current?'<span class="pnow">вы здесь</span>':''}</div>
          <p class="tiny" style="margin:var(--s2) 0">${esc(s.why)}</p>
          <div class="pgoal">${esc(s.goal)}${s.prog?` · <b>${esc(s.prog)}</b>`:''}</div>
          ${s.done?'':`<button class="btn ${i===current?'primary':''}" style="margin-top:var(--s3);min-height:44px;padding:var(--s2) var(--s4);font-size:.9rem" onclick="${s.go}">Перейти</button>`}
        </div>
      </div>`).join('')}
  </div>
  <p class="tiny" style="margin-top:var(--s6)">Шаги отмечаются сами, по мере того как ты занимаешься. Ничего нажимать не нужно.</p>
  <div style="height:var(--s6)"></div>`;
}

function renderHow(){
  return `
  <button class="btn ghost back" onclick="go('home')">← на главную</button>
  <h1>Как это устроено</h1>
  <p class="lead">Приложение работает не так, как большинство языковых сервисов. Разница в одном: оно рассчитывает, когда ты забудешь слово, и показывает его прямо перед этим.</p>

  <h2>Четыре кнопки под карточкой</h2>
  <p>Это не оценка тебя — это сообщение алгоритму, через сколько дней слово стоит показать снова. Отвечать надо честно: завысишь — забудешь, занизишь — будешь видеть одно и то же.</p>
  <div class="forms-list" style="margin-top:var(--s4)">
    <div class="frow"><i>Не помню</i><b>вернётся сегодня</b></div>
    <div class="frow"><i>Трудно</i><b>интервал почти не растёт</b></div>
    <div class="frow"><i>Нормально</i><b>интервал растёт как обычно</b></div>
    <div class="frow"><i>Легко</i><b>интервал растёт быстрее</b></div>
  </div>

  <h2>Откуда берутся интервалы</h2>
  <p>Память теряет новое не постепенно, а рывком: большая часть выученного уходит в первые сутки. Но каждое возвращение к слову делает эту кривую положе. Поэтому повторять важнее <b>вовремя</b>, чем часто.</p>
  <p>Алгоритм ведёт для каждого слова свой счёт: сначала показывает через день, потом через три, потом через неделю, месяц, полгода. Если слово даётся тяжело, интервал сокращается автоматически.</p>

  <h2>Что значит «выучено»</h2>
  <p>Слово попадает в этот счётчик после двух успешных повторений подряд. Это не значит, что ты знаешь его навсегда, — это значит, что оно ушло в долгую очередь и вернётся нескоро.</p>

  <h2>Почему нет счётчика дней подряд</h2>
  <p>Потому что он мотивирует не учиться, а не терять цифру. Пропустила день — цифра сгорела — смысл продолжать пропал. Здесь пропуск не наказывается ничем: карточки просто дождутся, очередь будет длиннее, а выученное останется выученным.</p>

  <h2>Зачем транскрипция</h2>
  <p>Английское написание почти не связано с произношением: <i>through</i>, <i>though</i>, <i>tough</i> читаются по-разному. Угадывать бесполезно, поэтому у каждого слова стоит запись звучания в международном алфавите. Он читается за один вечер и дальше работает всю жизнь.</p>

  <h2>В обе стороны</h2>
  <p>Карточка иногда спрашивает «что значит это слово», а иногда «как это по-английски». Первое тренирует понимание, второе — способность вспомнить слово в разговоре. Это разные навыки, и второй важнее для речи.</p>

  <h2>Свои слова</h2>
  <p>Любое слово из текста можно тапнуть и добавить в карточки. Слова, которые ты выбрала сама, запоминаются заметно лучше выданных — просто потому, что встретились в живом тексте, а не в списке.</p>
  <div style="height:var(--s6)"></div>`;
}

/* ---------- КАРТОЧКИ ---------- */
function renderCards(){
  const b = $('#cards-body');
  if(!session){
    const due = dueList().length, fresh = Math.min(newList().length, S.opts.newPerSession);
    const leeches = leechList();
    const q = (S.query||'').trim().toLowerCase();
    const found = q.length < 2 ? [] : allCards().filter(c =>
        c.w.toLowerCase().includes(q) || String(c.tr).toLowerCase().includes(q)).slice(0, 40);
    b.innerHTML = `<h1>Слова</h1>
      <p class="lead">${due} на повторение · ${fresh} ${plural(fresh,'новое','новых','новых')}</p>
      <button class="btn primary block" onclick="startSession()">Начать сессию</button>

      <h2>Поиск</h2>
      <input class="cloze-input" style="margin-top:0" type="search" placeholder="слово по-английски или по-русски"
             value="${esc(S.query||'')}" oninput="S.query=this.value;renderCards()">
      ${q.length >= 2 ? (found.length ? `<div class="list" style="margin-top:var(--s3)">
          ${found.map(c=>{
            const st = S.cards[c.id];
            return `<div class="list-item" style="cursor:default">
              <span class="dot ${st&&st.reps>=2?'done':''}"></span>
              <span style="flex:1"><span class="ttl">${esc(c.w)}${c.ipa?` <span class="tiny" style="color:var(--accent)">/${esc(c.ipa)}/</span>`:''}</span>
              <span class="sub">${esc(c.tr)}${st?` · ${st.reps>=2?'выучено':'в работе'}`:''}</span></span>
              ${st?'':`<button class="mini" onclick="S.cards['${c.id}']=newState();save();renderCards()">${PLUS_ICON}</button>`}
            </div>`;
          }).join('')}
        </div>` : `<p class="tiny" style="margin-top:var(--s3)">Ничего не нашлось. Попробуй другую часть слова.</p>`) : ''}

      ${leeches.length ? `
        <h2>Трудные слова</h2>
        <p class="tiny" style="margin:calc(var(--s2) * -1) 0 var(--s3)">Эти слова забываются чаще остальных. Ещё один показ им не поможет — стоит придумать свою зацепку.</p>
        <div class="list">
          ${leeches.slice(0,12).map(x=>`<div class="list-item" style="cursor:default">
            <span class="dot" style="background:var(--bad)"></span>
            <span style="flex:1"><span class="ttl">${esc(x.c.w)}</span>
            <span class="sub">${esc(x.c.tr)} · ${x.lapses} ${plural(x.lapses,'промах','промаха','промахов')}${S.notes[x.id]?' · подсказка есть':''}</span></span>
            <button class="mini" onclick="editNote('${x.id}')">${S.notes[x.id]?'изменить':'подсказка'}</button>
          </div>`).join('')}
        </div>` : ''}
      <div style="height:var(--s6)"></div>`;
    return;
  }
  if(!session.q.length){
    const n = session.done, got = session.learned;
    const nextDue = Object.values(S.cards).map(c=>c.due).filter(d=>diffDays(today(), d) > 0).sort()[0];
    const inDays = nextDue ? diffDays(today(), nextDue) : 0;
    b.innerHTML = `<div class="finish">
      ${cat(96,'sleep')}
      <h1>Готово</h1>
      <p class="muted" style="margin-bottom:var(--s6)">${n} ${plural(n,'карточка','карточки','карточек')} за подход</p>

      ${got.length ? `
        <div class="won">
          <div class="won-hd">${got.length===1?'Слово ушло в долгую память':`${got.length} ${plural(got.length,'слово ушло','слова ушли','слов ушли')} в долгую память`}</div>
          ${got.slice(0,4).map(x=>`<div class="won-row">
            <span class="won-w">${esc(x.w)}</span>
            <span class="won-tr">${esc(x.tr)}</span>
            <span class="won-iv">вернётся через ${x.iv} ${plural(x.iv,'день','дня','дней')}</span>
          </div>`).join('')}
          ${got.length>4?`<div class="tiny" style="margin-top:var(--s2)">и ещё ${got.length-4}</div>`:''}
        </div>` : `
        <p class="tiny" style="max-width:330px;margin:0 auto var(--s5)">
          Сегодня ничего нового не закрепилось — это нормально. Память укладывает слова не за один заход,
          а за несколько встреч с ними.
        </p>`}

      <div class="metrics" style="margin:var(--s5) 0">
        <div><b>${learnedCount()}</b><span>выучено</span></div>
        <div><b>${session.easy}</b><span>уверенно</span></div>
        <div><b>${inDays||'—'}</b><span>${inDays?plural(inDays,'день до след.','дня до след.','дней до след.'):'всё сегодня'}</span></div>
      </div>

      <p class="tiny" style="max-width:340px;margin:0 auto var(--s6)">
        Даты следующих повторений расставлены. Придёшь через неделю — ничего не сломается,
        очередь просто будет длиннее.
      </p>

      <div class="stack" style="max-width:300px;margin:0 auto">
        ${got.length?`<button class="btn primary block" onclick="shareCard('word')">Сохранить картинкой</button>`:''}
        <button class="btn block" onclick="go('read')">Почитать текст</button>
        <button class="btn block" onclick="go('home')">На главную</button>
      </div>
    </div>`;
    return;
  }

  const id = session.q[0];
  const c = cardById(id);
  if(!c){ session.q.shift(); return render(); }
  const st = S.cards[id];
  const isNew = !st;
  // направление: новые и чётные повторения — EN→RU, нечётные — RU→EN
  const reverse = S.opts.mode==='both' && st && st.reps%2===1;
  const pct = Math.round(session.done / session.total * 100);

  /* Слово, которое уже узнаётся, пора начинать доставать из памяти самой.
     Каждое третье повторение — вписывание вместо переворота. */
  if(S.opts.write && st && st.reps >= 2 && st.reps % 3 === 2 && clozeFor(c)){
    b.innerHTML = renderCloze(c, id, isNew, pct);
    return;
  }

  const isPhrase = c.deck === 'phrase';
  const isVerb = c.deck === 'verb';
  const q = s => String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
  const termSize = c.w.length > 26 ? '1.5rem' : c.w.length > 14 ? '2rem' : '2.7rem';

  /* Карточка форм глагола: спрашиваем не значение, а две изменённые формы */
  if(isVerb){
    const vFront = `<div class="ask">какие формы?</div>
      <div class="term" style="font-size:2.7rem">${esc(c.base)}</div>
      <div class="pos">${esc(c.gloss)}</div>`;
    const vBack = `<div class="vcard">
        <div><i>начальная форма</i><b>${esc(c.base)}</b></div>
        <div><i>вчера (прошедшее)</i><b>${esc(c.past)}</b></div>
        <div><i>после have и was</i><b>${esc(c.part)}</b></div>
      </div>
      <div class="meaning" style="font-size:1.15rem; margin-top:var(--s5)">${esc(c.gloss)}</div>
      ${S.opts.audio?`<div style="margin-top:var(--s4)"><button class="speak" onclick="event.stopPropagation();speak('${q(c.base)}, ${q(c.past)}, ${q(c.part)}',1)">${SPK_SLOW} все три формы</button></div>`:''}`;
    b.innerHTML = cardShell(id, isNew, pct, vFront, vBack);
    return;
  }

  /* Лицевая сторона — только вопрос, ничего лишнего. */
  const front = reverse
    ? `<div class="ask">как это по-английски?</div>
       <div class="term" style="font-size:${isPhrase?'1.5rem':'2rem'}">${esc(c.tr)}</div>
       <div class="pos">${posName(c.pos)}</div>`
    : `<div class="term" style="font-size:${termSize}">${esc(c.w)}</div>
       ${c.ipa?`<div class="ipa">/${esc(c.ipa)}/</div>`:''}
       ${S.opts.audio?`<div class="row" style="justify-content:center;margin-top:var(--s4)">
         <button class="speak" onclick="event.stopPropagation();speak('${q(c.w)}')">${SPK} обычно</button>
         <button class="speak" onclick="event.stopPropagation();speak('${q(c.w)}',1)">${SPK_SLOW} медленно</button></div>`:''}`;

  /* Оборот — полная карточка слова: написание, звучание, значение, пример.
     Всё вместе: именно в этот момент связь и запоминается. */
  const back = `
    <div class="term" style="font-size:${termSize}">${esc(c.w)}</div>
    ${c.ipa?`<div class="ipa">/${esc(c.ipa)}/</div>`:''}
    ${S.opts.audio?`<div class="row" style="justify-content:center;margin-top:var(--s3)">
      <button class="speak" onclick="event.stopPropagation();speak('${q(c.w)}',1)">${SPK_SLOW} медленно</button></div>`:''}
    <div class="divider"></div>
    <div class="meaning">${esc(c.tr)}</div>
    <div class="pos">${posName(c.pos)}</div>
    ${c.pos === 'гл' && /^[a-z]+$/.test(c.w) ? formsBlock(c.w) : ''}
    ${noteBlock(id)}
    ${c.ex?`<div class="example">
      <div class="lbl">в предложении</div>
      <div class="en">${esc(c.ex)}</div>
      <div class="ru">${esc(c.exru)}</div>
      ${S.opts.audio?`<div style="margin-top:var(--s3)"><button class="speak" onclick="event.stopPropagation();speak('${q(c.ex)}',1)">${SPK_SLOW} медленно</button></div>`:''}
    </div>`:''}

  b.innerHTML = cardShell(id, isNew, pct, front, back);
}

/* ==========================================================================
   УПРАЖНЕНИЕ НА ВПИСЫВАНИЕ
   Узнавание и извлечение из памяти — разные навыки. Переворот карточки
   тренирует первое, а говорить помогает второе. Поэтому у слова, которое
   уже узнаётся, мы прячем его в собственном примере и просим вписать.
   ========================================================================== */
function clozeFor(c){
  if(!c.ex || !c.w || c.deck === 'phrase' || c.deck === 'verb') return null;
  const base = c.w.toLowerCase();
  // все формы, в которых слово может стоять в примере
  const variants = new Set([base, sForm(base), pastForm(base), partForm(base), ingForm(base), base+'s']);
  const tokens = c.ex.match(/[A-Za-z']+/g) || [];
  const hit = tokens.find(t => variants.has(t.toLowerCase()));
  if(!hit) return null;
  let replaced = false;
  const text = c.ex.replace(/[A-Za-z']+/g, t => {
    if(!replaced && t.toLowerCase() === hit.toLowerCase()){ replaced = true; return '_____'; }
    return t;
  });
  return {text, answer:hit, changed: hit.toLowerCase() !== base};
}
function normAnswer(s){ return String(s).toLowerCase().replace(/[^a-z']/g,''); }

function renderCloze(c, id, isNew, pct){
  const cz = clozeFor(c);
  const state = session.cloze;       // null | {ok, given}
  const checked = !!state;
  return `
  <div class="row" style="margin-bottom:var(--s2)">
    <button class="btn ghost" onclick="go('home')">← выйти</button>
    <div class="spacer"></div>
    <span class="tiny num">${session.done} / ${session.total} · впиши слово</span>
  </div>
  <div class="bar" style="margin-bottom:var(--s5)"><i style="width:${pct}%"></i></div>

  <div class="face" style="min-height:auto; text-align:left; padding:var(--s6) var(--s5)">
    <div class="ask" style="text-align:left">впиши пропущенное слово</div>
    <div class="cloze-en">${esc(cz.text)}</div>
    <div class="cloze-ru">${esc(c.exru)}</div>
    <div class="cloze-hint">${esc(c.tr)}${cz.changed?' · слово нужно поставить в нужную форму':''}</div>

    ${checked ? `
      <div class="cloze-res ${state.ok?'ok':'no'}">
        ${state.ok ? 'Верно' : `Правильно: <b>${esc(cz.answer)}</b>${state.given?` · ты написала «${esc(state.given)}»`:' · пропущено'}`}
      </div>
      <div class="cloze-full">${esc(c.ex)}</div>
    ` : `
      <input id="cloze-in" class="cloze-input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="none" spellcheck="false" placeholder="напиши слово"
             onkeydown="if(event.key==='Enter')checkCloze('${id}')">
      <div class="row" style="margin-top:var(--s4)">
        <button class="btn primary" style="flex:1" onclick="checkCloze('${id}')">Проверить</button>
        <button class="btn" onclick="checkCloze('${id}',true)">Не помню</button>
      </div>
    `}
  </div>

  ${checked ? `
  <div class="grades" style="margin-top:var(--s4)">
    <button class="grade g0" onclick="gradeCard('${id}',0)"><b>Не помню</b><span>сегодня ещё раз</span></button>
    <button class="grade g1" onclick="gradeCard('${id}',1)"><b>Трудно</b><span>${prevText(id,1)}</span></button>
    <button class="grade g2" onclick="gradeCard('${id}',2)"><b>Нормально</b><span>${prevText(id,2)}</span></button>
    <button class="grade g3" onclick="gradeCard('${id}',3)"><b>Легко</b><span>${prevText(id,3)}</span></button>
  </div>
  <p class="tiny" style="text-align:center;margin-top:var(--s4)">${state.ok?'Вспомнила сама — это и есть тот навык, который нужен в разговоре.':'Ошибиться здесь полезнее, чем просто увидеть слово: память цепляется за попытку.'}</p>
  ` : ''}`;
}

function checkCloze(id, giveUp){
  const c = cardById(id); if(!c) return;
  const cz = clozeFor(c); if(!cz) return;
  const el = document.getElementById('cloze-in');
  const given = el ? el.value.trim() : '';
  const ok = !giveUp && normAnswer(given) === normAnswer(cz.answer);
  session.cloze = {ok, given};
  render();
}

/* Слово, которое раз за разом забывается, не выучится от ещё одного показа.
   Нужен другой ход — своя ассоциация. Чужие мнемоники работают плохо,
   поэтому предлагаем записать собственную. */
const LEECH = 4;
function isLeech(id){ const st = S.cards[id]; return !!st && st.lapses >= LEECH; }
function leechList(){
  return Object.keys(S.cards).filter(isLeech)
    .map(id => ({id, c:cardById(id), lapses:S.cards[id].lapses}))
    .filter(x => x.c).sort((a,b) => b.lapses - a.lapses);
}
function noteBlock(id){
  const note = S.notes[id];
  const leech = isLeech(id);
  if(!note && !leech) return '';
  return `<div class="note-card ${leech?'leech':''}" onclick="event.stopPropagation()">
    ${leech && !note ? `<div class="nc-hd">это слово тебе не даётся · ${S.cards[id].lapses} ${plural(S.cards[id].lapses,'промах','промаха','промахов')}</div>
      <p class="tiny" style="margin:0 0 var(--s3)">Ещё один показ не поможет — нужен другой ход. Придумай, за что зацепиться:
      созвучие с русским словом, разбор на части, живая картинка, случай из жизни. Своя ассоциация работает в разы лучше чужой.</p>` : ''}
    ${note ? `<div class="nc-hd">твоя подсказка</div><div class="nc-body">${esc(note)}</div>` : ''}
    <button class="mini" style="margin-top:var(--s3)" onclick="event.stopPropagation();editNote('${id}')">${note?'изменить':'записать подсказку'}</button>
  </div>`;
}
function editNote(id){
  const cur = S.notes[id] || '';
  const v = prompt('Чем зацепить это слово? Ассоциация, созвучие, картинка — что угодно, лишь бы своё.', cur);
  if(v === null) return;
  if(v.trim()) S.notes[id] = v.trim(); else delete S.notes[id];
  save(); render();
}

/* Формы глагола прямо на карточке: выучить слово мало, нужно уметь
   поставить его в прошедшее и собрать с ним время. */
function formsBlock(w){
  const f = verbForms(w);
  const rows = [
    ['I, you, we, they', w, `Я, ты, мы, они ${esc(w)}`],
    ['he, she, it', f.s, 'С he, she, it глагол получает -s. Это единственное место, где английский глагол меняется в настоящем времени.'],
    ['вчера', f.past, 'Прошедшее время.'],
    ['I have…, it was…', f.part, 'Третья форма. Нужна для Present Perfect (I have ' + esc(f.part) + ') и для пассива (it was ' + esc(f.part) + ').'],
    ['сейчас, в процессе', f.ing, 'Форма на -ing: I am ' + esc(f.ing) + '.']
  ];
  return `<div class="forms ${f.irregular?'irr':''}">
    <div class="forms-hd">${f.irregular ? 'неправильный глагол' : 'формы строятся по правилу'}</div>
    <div class="forms-list">
      ${rows.map((r,i)=>`<div class="frow"><i>${r[0]}</i><b class="${i===2||i===3?'key':''}">${esc(r[1])}</b></div>`).join('')}
    </div>
    <div class="forms-note">${f.irregular
      ? 'Две выделенные формы по правилу не выводятся — их знают наизусть. Вся группа разобрана в разделе «Формы глаголов».'
      : 'Правильный глагол: в прошедшем и в третьей форме просто добавляется -ed.'}</div>
  </div>`;
}

function prevText(id, g){
  const ns = schedule(S.cards[id]||newState(), g);
  const d = ns.iv;
  if(d<=0) return 'сегодня';
  if(d===1) return 'завтра';
  if(d<7) return 'через '+d+' дн.';
  if(d<31) return 'через '+Math.round(d/7)+' нед.';
  return 'через '+Math.round(d/30)+' мес.';
}

let quizState = null;
function renderQuiz(g){
  if(!quizState || quizState.gid !== g.id) quizState = {gid:g.id, i:0, score:0, picked:null};
  const q = g.quiz[quizState.i];
  const el = $('#quiz');
  if(!q){
    const s = quizState.score, t = g.quiz.length;
    S.quiz[g.id] = {score:s}; save();
    el.innerHTML = `<div class="card" style="text-align:center">
      <div class="num" style="font-size:2.2rem">${s} / ${t}</div>
      <p class="tiny" style="margin:var(--s2) 0 var(--s4)">${s===t?'Тема закрыта. Возвращаться к ней не нужно.':'Ошибки здесь ничего не стоят — перечитай объяснение выше и попробуй ещё раз.'}</p>
      <div class="stack">
        <button class="btn primary block" onclick="go('gram')">К списку тем</button>
        <button class="btn block" onclick="quizState=null;renderQuiz(GRAMMAR[${sub}])">Пройти заново</button>
      </div>
    </div>`;
    return;
  }
  el.innerHTML = `<div class="card">
    <div class="tiny" style="margin-bottom:var(--s2)">Вопрос ${quizState.i+1} из ${g.quiz.length}</div>
    <p style="font-weight:500; font-size:1.03rem">${esc(q.q)}</p>
    ${q.o.map((o,i)=>{
      let cls='';
      if(quizState.picked!==null){
        if(i===q.a) cls='correct';
        else if(i===quizState.picked) cls='wrong';
      }
      return `<button class="opt ${cls}" ${quizState.picked!==null?'disabled':''} onclick="pickAnswer(${i})">${esc(o)}</button>`;
    }).join('')}
    ${quizState.picked!==null?`
      <div class="note ${quizState.picked===q.a?'why':'trap'}">${esc(q.e)}</div>
      <button class="btn primary block" onclick="quizState.i++;quizState.picked=null;renderQuiz(GRAMMAR[${sub}])">Дальше</button>`:''}
  </div>`;
}
function pickAnswer(i){
  const g = GRAMMAR[sub];
  if(quizState.picked!==null) return;
  quizState.picked = i;
  if(i === g.quiz[quizState.i].a) quizState.score++;
  renderQuiz(g);
}

/* Честная оценка сложности: сколько слов текста уже знакомо.
   Читать комфортно примерно с 90% — остальное достраивается из контекста. */
/* Служебные слова считаем знакомыми: они впитываются сами, из любого текста,
   и не мешают чтению. Иначе процент занижен вдвое и ничего не говорит о сложности. */
const BASIC = new Set(('i you he she it we they me my your his her its our their them us him ' +
 'the a an this that these those there here ' +
 'is are am was were be been being has have had do does did will would can could must should may might ' +
 'to of in on at for with from by into about over under after before during until since ' +
 'and or but if because so than as not no yes ' +
 'when where why how what who which whose ' +
 'very too more most less much many few all both some any other another each every ' +
 'up down out off back just only still already again now then here there ' +
 'one two three four five six seven eight nine ten ' +
 "i'm it's that's don't doesn't didn't isn't aren't can't won't i'll i'd you're we're they're there's what's let's").split(' '));

function textKnown(t){
  const words = [...new Set((t.body.map(x=>x[0]).join(' ').toLowerCase().match(/[a-z']+/g) || []))];
  if(!words.length) return 0;
  let known = 0;
  words.forEach(x => {
    const k = x.replace(/^'+|'+$/g,'');
    if(BASIC.has(k)){ known++; return; }
    const r = resolve(k, t);
    const base = (r && r.base) || k;
    const st = S.cards[base] || S.cards[k];
    if(st && st.reps >= 2) known++;
  });
  return Math.round(known / words.length * 100);
}
function knownLabel(p){
  if(p >= 90) return ['легко', 'ok'];
  if(p >= 70) return ['по силам', 'mid'];
  if(p >= 40) return ['будет трудно', 'hard'];
  return ['пока рано', 'hard'];
}

/* ---------- ЧТЕНИЕ ---------- */
function renderRead(){
  const b = $('#read-body');
  if(sub === null){
    b.innerHTML = `<h1>Чтение</h1>
    <p class="lead">Тапни по любому слову — увидишь перевод и транскрипцию.</p>
    <div class="list">${TEXTS.map((t,i)=>{
      const k = textKnown(t), lab = knownLabel(k);
      return `<button class="list-item" onclick="go('read',${i})">
      <span class="dot ${S.read[t.id]&&S.read[t.id].done?'done':''}"></span>
      <span style="flex:1"><span class="ttl">${esc(t.title)}</span>
      <span class="sub">${t.level} · ${t.mins} мин · знакомо ${k}% слов, ${lab[0]}</span></span>
      <span class="know ${lab[1]}">${k}%</span>
    </button>`;}).join('')}</div>
    <p class="tiny" style="margin-top:var(--s4)">Не старайся понять каждое слово. Задача — идти дальше, даже когда что-то непонятно: скорость здесь важнее точности.</p>`;
    return;
  }
  const t = TEXTS[sub];
  const showRu = !!(S.read[t.id] && S.read[t.id].ru);
  b.innerHTML = `
  <button class="btn ghost back" onclick="go('read')">← все тексты</button>
  <h1>${esc(t.title)}</h1>
  <p class="lead">${t.level} · ${esc(t.lead)}</p>
  <p class="tiny" style="margin-top:calc(var(--s3) * -1)">Из ${new Set((t.body.map(x=>x[0]).join(' ').toLowerCase().match(/[a-z']+/g)||[])).size} разных слов текста ты уже знаешь ${textKnown(t)}%. Точками подчёркнуты слова, которые можно тапнуть.</p>
  <div class="row wrap-r" style="margin-bottom:var(--s5)">
    <button class="mini" onclick="toggleRu(${sub})">${showRu?'Скрыть перевод':'Показать перевод'}</button>
    ${S.opts.audio?`<button class="mini" onclick="speak(${JSON.stringify(t.body.map(x=>x[0]).join(' ')).replace(/"/g,'&quot;')},1)">${SPK_SLOW} медленно</button>`:''}
  </div>
  <div class="text-body">
    ${t.body.map(x=>`<div style="margin-bottom:${showRu?'var(--s4)':'var(--s1)'}">
      ${tokenize(x[0], t)}
      ${showRu?`<div class="tiny" style="margin-top:2px">${esc(x[1])}</div>`:''}
    </div>`).join('')}
  </div>
  <button class="btn ${S.read[t.id]&&S.read[t.id].done?'':'primary'} block" style="margin-top:var(--s5)" onclick="markRead(${sub})">
    ${S.read[t.id]&&S.read[t.id].done?'Прочитано ✓':'Отметить прочитанным'}
  </button>
  <div style="height:var(--s6)"></div>`;
}
function toggleRu(i){
  const t = TEXTS[i];
  S.read[t.id] = S.read[t.id]||{};
  S.read[t.id].ru = !S.read[t.id].ru;
  save(); renderRead();
}
function markRead(i){
  const t = TEXTS[i];
  S.read[t.id] = S.read[t.id]||{};
  S.read[t.id].done = true;
  save(); renderRead();
}
/* Словоформы: words → word, studies → study, stopped → stop, making → make.
   Без этого половина текста осталась бы без перевода. */
function lemmas(w){
  const o = [w];
  if(IRREG_BACK[w])             o.push(IRREG_BACK[w]);          // went → go, made → make
  if(/ies$/.test(w))            o.push(w.slice(0,-3)+'y');
  if(/(ches|shes|sses|xes|ses|zes)$/.test(w)) o.push(w.slice(0,-2));
  if(/s$/.test(w) && !/ss$/.test(w)) o.push(w.slice(0,-1));
  if(/ed$/.test(w))             o.push(w.slice(0,-2), w.slice(0,-1));
  if(/ing$/.test(w))            o.push(w.slice(0,-3), w.slice(0,-3)+'e');
  if(/([bdfglmnprt])\1(ed|ing)$/.test(w)) o.push(w.replace(/([bdfglmnprt])\1(ed|ing)$/,'$1'));
  if(/ier$/.test(w))            o.push(w.slice(0,-3)+'y');
  if(/iest$/.test(w))           o.push(w.slice(0,-4)+'y');
  if(/er$/.test(w))             o.push(w.slice(0,-2), w.slice(0,-1));   // slower → slow
  if(/est$/.test(w))            o.push(w.slice(0,-3), w.slice(0,-2));   // hardest → hard
  return [...new Set(o)].filter(Boolean);
}
/* Возвращает {ipa, tr, base} либо null. base — исходная форма, если слово в тексте изменено. */
function resolve(k, text){
  for(const form of lemmas(k)){
    const card = CARDS.find(c=>c.id===form);
    if(card) return {ipa:card.ipa, tr:card.tr, base: form===k?null:form};
    const g = (text && text.gloss[form]) || COMMON[form];
    if(g) return {ipa:g[0], tr:g[1], base: form===k?null:form};
  }
  return null;
}

function tokenize(sentence, text){
  const ti = TEXTS.indexOf(text);
  return sentence.split(/([A-Za-z']+)/).map(tok=>{
    if(!/^[A-Za-z']+$/.test(tok)) return esc(tok);
    const k = tok.toLowerCase().replace(/^'+|'+$/g,'');
    if(!resolve(k, text)) return esc(tok);
    const st = S.cards[k] || S.cards[(resolve(k,text).base)||k];
    const known = st && st.reps>=2;
    return `<span class="w ${known?'known':''}" onclick="lookup('${k}',${ti})">${esc(tok)}</span>`;
  }).join('');
}
function lookup(k, ti){
  const t = TEXTS[ti];
  const r = resolve(k, t);
  if(!r) return;
  const key = r.base || k;
  const tracked = !!S.cards[key];
  $('#pop').innerHTML = `
    <div class="row" style="align-items:flex-start">
      <div style="flex:1">
        <div class="num" style="font-size:1.6rem">${esc(k)}</div>
        ${r.base?`<div class="tiny" style="margin-top:2px">форма слова <b>${esc(r.base)}</b></div>`:''}
        <div class="ipa" style="font-size:1rem;margin-top:var(--s1)">/${esc(r.ipa)}/</div>
        <div style="margin-top:var(--s2)">${esc(r.tr)}</div>
      </div>
      <button class="btn ghost" style="padding:0 var(--s2);color:var(--ink-3)" onclick="closePop()">✕</button>
    </div>
    <div class="row wrap-r" style="margin-top:var(--s4)">
      ${S.opts.audio?`<button class="speak" onclick="speak('${esc(k)}',1)">${SPK_SLOW} медленно</button>`:''}
      ${tracked ? `<span class="tiny">уже в карточках${S.cards[key].reps>=2?' · выучено':''}</span>`
        : `<button class="mini" onclick="addCard('${esc(key)}',${ti})">${PLUS_ICON} в карточки</button>`}
    </div>`;
  $('#pop').classList.add('on');
}
function closePop(){ const p=$('#pop'); if(p) p.classList.remove('on'); }
function addCard(k, ti){
  const t = TEXTS[ti];
  const r = resolve(k, t);
  if(!r) return;
  if(!CARDS.find(c=>c.id===k)){
    const sent = (t && t.body.find(s=>new RegExp('\\b'+k, 'i').test(s[0]))) || ['',''];
    S.custom[k] = {id:k, deck:'custom', w:k, ipa:r.ipa, tr:r.tr, pos:'из текста', ex:sent[0], exru:sent[1]};
  }
  S.cards[k] = newState();
  save(); closePop(); render();
}

load();
applyTheme();
render();
