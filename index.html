<!DOCTYPE html>
<!--
  Quiet English — приложение для изучения английского без давления:
  без счётчика дней подряд, с упором на чтение и с грамматикой,
  объяснённой через сравнение с русским.

  © 2026 Анастасия (github.com/lanavin). Лицензия MIT.
  Автор проекта: Анастасия · https://github.com/lanavin
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="author" content="Анастасия (github.com/lanavin)">
<meta name="description" content="Quiet English — английский без счётчика дней и без вины: 673 слова по частоте, 20 тем грамматики с объяснением «почему», разговорник на 27 бытовых ситуаций, интервальные повторения.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FAFAF8">
<title>Quiet English</title>
<style>
/* ==========================================================================
   ДИЗАЙН-СИСТЕМА
   Тёплая светлая база, один акцент, иерархия размером и весом.
   Шкала отступов кратна 4. Радиусы: 8 / 12 / 16 — и только они.
   ========================================================================== */
:root{
  --bg:#FBF8F2;  --surface:#FFFFFF;  --sunk:#F4EFE4;  --sunk-2:#EDE6D6;
  --ink:#2B2721; --ink-2:#6B6153;    --ink-3:#857C6E;
  --line:#E9E1D2; --line-2:#DDD3BF;

  --accent:#A5522F;      --accent-soft:#F7EAE1;  --accent-line:#EFD9C9;
  --ok:#4E7055;          --ok-soft:#E8EFE7;
  --sky:#416B85;         --sky-soft:#E4EDF2;
  --warn:#8A5F0F;        --warn-soft:#FAF0DA;
  --bad:#9C3E36;         --bad-soft:#F9E7E4;

  --r-s:8px; --r-m:12px; --r-l:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --fs:17px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --shadow:0 1px 2px rgba(26,26,24,.04), 0 8px 24px -12px rgba(26,26,24,.10);
}
html[data-theme="dark"]{
  --bg:#1A1815; --surface:#232019; --sunk:#2C2822; --sunk-2:#373229;
  --ink:#F3EEE3; --ink-2:#ADA396; --ink-3:#847B6E;
  --line:#332F27; --line-2:#433D33;
  --accent:#D9906B; --accent-soft:#33231A; --accent-line:#452F22;
  --ok:#8FB795; --ok-soft:#1F2A20;
  --sky:#86AEC6; --sky-soft:#1B262D;
  --warn:#D2A24F; --warn-soft:#2E2515;
  --bad:#D4877E; --bad-soft:#2E1C19;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.6;
  font-feature-settings:"cv05","ss01"; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.wrap{max-width:600px; margin:0 auto; padding:var(--s6) var(--s5) var(--s2)}

/* ---------- типографика ---------- */
h1{font-family:var(--serif); font-size:1.75rem; font-weight:500; line-height:1.22; letter-spacing:-.015em; margin:0 0 var(--s2)}
h2{font-size:1.14rem; font-weight:600; letter-spacing:-.01em; margin:var(--s7) 0 var(--s3)}
h3{font-size:.78rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin:var(--s6) 0 var(--s3)}
p{margin:0 0 var(--s3)}
.lead{color:var(--ink-2); font-size:.97rem; line-height:1.55; margin-bottom:var(--s5); max-width:34em}
.muted{color:var(--ink-2)}
.tiny{font-size:.8rem; line-height:1.5; color:var(--ink-3)}
.num{font-family:var(--serif); font-variant-numeric:tabular-nums; letter-spacing:-.02em}

/* ---------- поверхности ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:var(--s5)}
.card + .card{margin-top:var(--s3)}
.plain{background:none; border:0; padding:0}
.row{display:flex; gap:var(--s3); align-items:center}
.row.wrap-r{flex-wrap:wrap}
.spacer{flex:1}
.stack > * + *{margin-top:var(--s3)}

/* ---------- кнопки ---------- */
button{font-family:inherit; font-size:inherit; cursor:pointer; color:inherit}
.btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  border-radius:var(--r-m); padding:var(--s3) var(--s4); font-weight:500; font-size:.97rem;
  min-height:50px; transition:background .15s ease, transform .1s ease, border-color .15s ease;
}
.btn:hover{background:var(--sunk)}
.btn:active{transform:scale(.98)}
.btn.primary:active{opacity:.92}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--bg); font-weight:500}
.btn.primary:hover{background:#000}
html[data-theme="dark"] .btn.primary:hover{background:#fff}
.btn.block{display:block; width:100%; text-align:center}
.btn.ghost{background:none; border-color:transparent; color:var(--ink-2); min-height:0; padding:var(--s2) 0; font-size:.88rem}
.btn.ghost:hover{background:none; color:var(--ink)}
.back{display:inline-flex; align-items:center; gap:6px; margin-bottom:var(--s4)}

/* ---------- оценки ---------- */
.grades{display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s2)}
.grade{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--r-m);
  padding:var(--s3) var(--s1); text-align:center; line-height:1.3; min-height:62px;
  transition:transform .1s ease;
}
.grade:active{transform:scale(.96)}
.grade b{display:block; font-size:.86rem; font-weight:600; line-height:1.25}
.grade span{display:block; font-size:.69rem; color:var(--ink-3); line-height:1.35; margin-top:5px}
.grade.g0{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.grade.g1{background:var(--warn-soft); border-color:transparent; color:var(--warn)}
.grade.g2{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.grade.g3{background:var(--sunk); border-color:transparent; color:var(--ink-2)}
.grade.g0 span,.grade.g1 span,.grade.g2 span,.grade.g3 span{color:inherit; opacity:.65}

/* ---------- нижняя навигация ---------- */
nav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
  padding:var(--s2) 0 calc(var(--s1) + env(safe-area-inset-bottom));
  display:flex;
}
nav button{
  flex:1; background:none; border:0; color:var(--ink-3);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:var(--s1) 2px; font-size:.63rem; letter-spacing:.01em; transition:color .15s ease;
}
nav button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
nav button.on{color:var(--ink); font-weight:600}
nav button.on svg{stroke-width:1.9}
nav button::after{content:''; width:4px; height:4px; border-radius:50%; background:transparent; margin-top:1px}
nav button.on::after{background:var(--accent)}
.badge{
  position:absolute; transform:translate(14px,-5px);
  background:var(--accent); color:#fff; border-radius:9px;
  font-size:.58rem; padding:1px 5px; font-weight:700; min-width:16px; text-align:center; letter-spacing:0;
}
.screen{display:none}
.screen.on{display:block; animation:in .24s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

/* ---------- иллюстрации ---------- */
.scene{display:block; width:100%; height:132px}
/* Кот не наследует цвета темы: иначе в тёмном режиме он получал светлые
   глаза на тёмной морде и превращался в кота из фильма ужасов.
   Шерсть всегда светлая, глаза всегда тёмные — в обеих темах. */
.cat{--fur:#EDE6D6; --fur-line:#DDD3BF; --fur-ink:#2B2721; --fur-pink:#D9A48D; --fur-nose:#C2755C}
html[data-theme="dark"] .cat{--fur:#D8CEB8; --fur-line:#BDB199; --fur-ink:#2B2721; --fur-pink:#C98F78; --fur-nose:#AC6249}
.cat .c-body{fill:var(--fur); stroke:var(--fur-line); stroke-width:1.6; stroke-linejoin:round}
.cat .c-inner{fill:var(--fur-pink); stroke:none}
.cat .c-nose{fill:var(--fur-nose); stroke:none}
.cat .c-blush{fill:var(--fur-pink); opacity:.5}
.cat .c-eye{fill:var(--fur-ink)}
.cat .c-line{fill:none; stroke:var(--fur-ink); stroke-width:2.4; stroke-linecap:round}
.cat .c-tail{fill:none; stroke:var(--fur); stroke-width:11; stroke-linecap:round}
.cat .c-whisk{fill:none; stroke:var(--fur-line); stroke-width:1.5; stroke-linecap:round}

/* ---------- главный экран ---------- */
.arch{
  border-radius:120px 120px var(--r-l) var(--r-l);
  overflow:hidden; border:1px solid var(--line); background:var(--surface);
  margin-bottom:var(--s5);
}
.arch .inner{padding:var(--s5) var(--s5) var(--s7); text-align:center; margin-top:-30px; position:relative}
.arch .cat{margin:0 auto var(--s3); display:block}
.hero{padding:0 0 var(--s6)}
.hero .kicker{font-size:.78rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s2)}
.hero .count{font-family:var(--serif); font-size:3.6rem; line-height:.98; letter-spacing:-.035em; font-variant-numeric:tabular-nums}
.hero .unit{font-size:.97rem; color:var(--ink-2); line-height:1.5; margin:var(--s3) auto var(--s5); max-width:19em}
.metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2)}
.metrics > div{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  padding:var(--s4) var(--s2); text-align:center}
.metrics b{display:block; font-family:var(--serif); font-size:1.55rem; font-weight:500; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; line-height:1.1; margin-bottom:6px}
.metrics span{display:block; font-size:.73rem; color:var(--ink-3); line-height:1.35}
.bar{height:5px; border-radius:3px; background:var(--sunk); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .5s cubic-bezier(.2,.7,.3,1)}
.spark{display:flex; gap:3px; align-items:flex-end; height:38px}
.spark div{flex:1; border-radius:2px; background:var(--accent); min-height:4px}

/* ---------- списки ---------- */
.list{border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden; background:var(--surface)}
.list-item{
  display:flex; align-items:center; gap:var(--s3); padding:var(--s4);
  border:0; border-bottom:1px solid var(--line); background:var(--surface);
  width:100%; text-align:left; min-height:60px; transition:background .15s ease;
}
.list-item:last-child{border-bottom:0}
.list-item:hover{background:var(--sunk)}
.list-item .ttl{display:block; font-weight:500; font-size:.97rem; line-height:1.4}
.list-item .sub{display:block; font-size:.8rem; color:var(--ink-3); line-height:1.45; margin-top:3px}
.chev{color:var(--line-2); flex:none; font-size:1.15rem; line-height:1; transition:color .15s ease, transform .15s ease}
.list-item:hover .chev{color:var(--ink-3); transform:translateX(2px)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--line-2); flex:none}
.dot.done{background:var(--ok)}

/* ---------- карточка слова ---------- */
.flip{perspective:1400px; cursor:pointer}
.flip-inner{
  display:grid; transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.75,.25,1);
}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.flip-inner > .face{grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.flip-inner > .face.back{transform:rotateY(180deg)}
.face{
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  padding:var(--s7) var(--s5); text-align:center; box-shadow:var(--shadow);
  display:flex; flex-direction:column; justify-content:center; min-height:320px;
}
.face.front .term{margin-top:var(--s2)}
@media (prefers-reduced-motion: reduce){
  .flip-inner{transition:none}
  .screen.on{animation:none}
}
.term{font-family:var(--serif); font-size:2.7rem; font-weight:500; letter-spacing:-.02em; line-height:1.2;
  overflow-wrap:anywhere; hyphens:auto}
.ipa{font-size:1.15rem; color:var(--accent); margin-top:var(--s2); font-family:var(--sans); letter-spacing:.01em}
.ask{font-size:.76rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s4)}
.divider{height:1px; background:var(--line); margin:var(--s5) auto; max-width:56px}
.meaning{font-size:1.4rem; line-height:1.35}
.pos{display:block; font-size:.74rem; letter-spacing:.05em; color:var(--ink-3); margin-top:var(--s2)}
/* ---------- формы глагола ---------- */
.forms{background:var(--sunk); border-radius:var(--r-m); padding:var(--s4); margin-top:var(--s5); text-align:left}
.forms.irr{background:var(--accent-soft)}
.forms-hd{font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s3)}
.forms.irr .forms-hd{color:var(--accent)}
.forms-list{display:grid; gap:1px; background:var(--line); border-radius:var(--r-s); overflow:hidden}
.frow{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4);
  background:var(--sunk); padding:var(--s3) var(--s4)}
.forms.irr .frow{background:var(--accent-soft)}
.frow i{font-style:normal; font-size:.8rem; color:var(--ink-2); line-height:1.4}
.frow b{font-weight:500; font-size:1.05rem; white-space:nowrap}
.frow b.key{font-weight:700; color:var(--accent)}
.forms.irr .frow i{color:var(--ink-2)}
.forms-row{display:flex; flex-wrap:wrap; gap:var(--s3) var(--s4)}
.forms-row span{display:flex; flex-direction:column; font-size:.98rem; line-height:1.35}
.forms-row i{font-style:normal; font-size:.66rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
.forms-row b{font-weight:600}
.forms-note{font-size:.76rem; line-height:1.45; color:var(--ink-2); margin-top:var(--s3)}
.vcard{display:grid; gap:var(--s3); max-width:280px; margin:0 auto; text-align:left}
.vcard > div{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4);
  padding-bottom:var(--s2); border-bottom:1px solid var(--line)}
.vcard i{font-style:normal; font-size:.72rem; letter-spacing:.04em; color:var(--ink-3)}
.vcard b{font-family:var(--serif); font-size:1.5rem; font-weight:500}
.vtable{border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden; background:var(--surface)}
.vhead{display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--s2); padding:var(--s3) var(--s4);
  background:var(--sunk); font-size:.68rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3)}
.vrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--s2) var(--s2);
  padding:var(--s3) var(--s4); border-top:1px solid var(--line); font-size:.98rem; align-items:baseline}
.vrow .v1{font-weight:600}
.vrow .vru{grid-column:1 / -1; font-size:.78rem; color:var(--ink-3); margin-top:-2px}

.example{background:var(--sunk); border-radius:var(--r-m); padding:var(--s4); margin-top:var(--s5); text-align:left}
.example .lbl{font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s2)}
.example .en{font-size:1rem; line-height:1.55}
.example .ru{font-size:.86rem; color:var(--ink-2); line-height:1.45; margin-top:6px}
.speak{
  border:1px solid var(--line-2); background:var(--surface); border-radius:99px;
  padding:7px 14px; font-size:.78rem; color:var(--ink-2); display:inline-flex; gap:6px; align-items:center; min-height:36px;
}
.speak:hover{background:var(--sunk)}
.speak svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- грамматика ---------- */
.note{border-radius:0 var(--r-m) var(--r-m) 0; padding:var(--s4) var(--s5);
  margin:var(--s4) 0; font-size:.95rem; line-height:1.65; border-left:3px solid var(--line-2)}
.note.why{background:var(--sunk); border-left-color:var(--ink-3)}
.note.trap{background:var(--warn-soft); color:#5C4210; border-left-color:var(--warn)}
html[data-theme="dark"] .note.trap{color:var(--warn)}
.note.trap b{color:var(--warn)}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:var(--s2); margin:var(--s2) 0}
.pair > div{border-radius:var(--r-s); padding:var(--s3) var(--s4); font-size:.92rem; line-height:1.5}
.pair .no{background:var(--bad-soft); color:var(--bad)}
.pair .yes{background:var(--ok-soft); color:var(--ok)}
.opt{
  display:block; width:100%; text-align:left; margin-bottom:var(--s2);
  border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r-m);
  padding:var(--s3) var(--s4); min-height:52px; font-size:.95rem; transition:background .15s ease;
}
.opt:hover:not(:disabled){background:var(--sunk)}
.opt.correct{background:var(--ok-soft); border-color:transparent; color:var(--ok); font-weight:600}
.opt.wrong{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.opt:disabled{cursor:default}
.exline{padding:var(--s3) 0; border-bottom:1px solid var(--line)}
.exline:last-child{border-bottom:0}

/* ---------- звуки ---------- */
.mouth{width:100%; max-width:320px; margin:0 auto; display:block}
.mouth .head{fill:var(--sunk); stroke:var(--ink-3); stroke-width:2.2; stroke-linejoin:round}
.mouth .cav{fill:var(--surface); stroke:var(--ink-3); stroke-width:1.8; stroke-linejoin:round}
.mouth .nasal{fill:var(--bg); stroke:var(--line-2); stroke-width:1.5}
.mouth .teeth{fill:var(--surface); stroke:var(--ink-2); stroke-width:1.6; stroke-linejoin:round}
.mouth .tongue{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2.6; stroke-linejoin:round}
.mouth .air{fill:none; stroke:var(--warn); stroke-width:2.6; stroke-dasharray:7 5; stroke-linecap:round}
.mouth .vox{fill:none; stroke:var(--accent); stroke-width:2.4; stroke-linecap:round}
.mouth .lbl{fill:var(--ink-3); font-size:11px; font-family:inherit}
.mouth .lblA{fill:var(--accent); font-size:11px; font-family:inherit; font-weight:600}
.mouth .lipsF{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2.6; stroke-linejoin:round}
.mouth .gap{fill:var(--ink)}
.mouth .thF{fill:var(--surface); stroke:var(--ink-2); stroke-width:1.4}
.mouth .tgF{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2}
.sound-hd{display:flex; align-items:baseline; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s1)}
.sound-hd .sym{font-family:var(--serif); font-size:2.4rem; color:var(--accent); line-height:1}
.step{display:flex; align-items:flex-start; gap:var(--s4); padding:var(--s3) 0; line-height:1.55}
.step i{flex:none; width:24px; height:24px; border-radius:50%; background:var(--sunk); color:var(--ink-2);
  display:grid; place-items:center; font-size:.72rem; font-weight:700; font-style:normal; margin-top:2px}
.minpair{display:flex; align-items:center; gap:var(--s4); padding:var(--s4) 0; border-bottom:1px solid var(--line)}
.minpair:last-child{border-bottom:0}

/* ---------- чтение ---------- */
.text-body{font-size:1.06rem; line-height:1.85}
.w{border-bottom:1px dotted var(--line-2); cursor:pointer; padding:0 1px; transition:background .12s ease}
.w:hover{background:var(--accent-soft); border-bottom-color:var(--accent)}
.w.known{border-bottom-color:transparent}
.pop{
  position:fixed; left:var(--s3); right:var(--s3); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:60;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:var(--s5);
  box-shadow:0 16px 48px -12px rgba(26,26,24,.22); max-width:520px; margin:0 auto; display:none;
}
.pop.on{display:block; animation:in .2s cubic-bezier(.2,.7,.3,1)}

/* ---------- разговорник ---------- */
.phrase{border-bottom:1px solid var(--line); padding:var(--s4) 0}
.phrase:last-child{border-bottom:0}
.phrase.hear{opacity:.92}
.phrase .en{font-size:1.03rem; line-height:1.55}
.phrase.hear .en{color:var(--ink-2)}
.phrase .ru{font-size:.86rem; color:var(--ink-3); line-height:1.45; margin-top:5px}
.phrase .acts{display:flex; gap:var(--s2) var(--s2); margin-top:var(--s3); flex-wrap:wrap}
.mini{
  border:1px solid var(--line-2); background:var(--surface); border-radius:99px;
  padding:7px 13px; font-size:.76rem; color:var(--ink-2);
  display:inline-flex; gap:5px; align-items:center; min-height:38px;
}
.mini:hover{background:var(--sunk)}
.mini svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mini.on{background:var(--ok-soft); border-color:transparent; color:var(--ok); font-weight:600}
.sec-hd{font-size:.76rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin:var(--s7) 0 var(--s2)}
.big{position:fixed; inset:0; z-index:200; background:var(--bg); display:none; padding:var(--s6); overflow:auto}
.big.on{display:flex; flex-direction:column; justify-content:center; animation:in .2s ease}
.big .txt{font-family:var(--serif); font-size:clamp(2rem,8vw,3.3rem); font-weight:500; line-height:1.2; letter-spacing:-.02em; text-align:center}
.big .sub{font-size:1rem; color:var(--ink-2); text-align:center; margin-top:var(--s5)}
.big .hint{position:fixed; left:0; right:0; bottom:calc(var(--s6) + env(safe-area-inset-bottom)); text-align:center; font-size:.76rem; color:var(--ink-3)}

/* ---------- доля знакомых слов ---------- */
.know{flex:none; font-size:.78rem; font-weight:600; padding:3px 9px; border-radius:99px;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.know.ok{background:var(--ok-soft); color:var(--ok)}
.know.mid{background:var(--warn-soft); color:var(--warn)}
.know.hard{background:var(--sunk); color:var(--ink-3)}

/* ---------- личная подсказка к слову ---------- */
.note-card{background:var(--sunk); border-radius:var(--r-m); padding:var(--s4); margin-top:var(--s4); text-align:left}
.note-card.leech{background:var(--bad-soft)}
.nc-hd{font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s2)}
.note-card.leech .nc-hd{color:var(--bad)}
.nc-body{font-size:.98rem; line-height:1.5}

/* ---------- упражнение на вписывание ---------- */
.cloze-en{font-size:1.3rem; line-height:1.6; margin-bottom:var(--s3)}
.cloze-ru{font-size:.95rem; color:var(--ink-2); line-height:1.5}
.cloze-hint{font-size:.84rem; color:var(--ink-3); margin-top:var(--s3); line-height:1.45}
.cloze-input{
  width:100%; margin-top:var(--s5); padding:var(--s3) var(--s4); min-height:52px;
  border:1px solid var(--line-2); border-radius:var(--r-m); background:var(--bg);
  font-family:var(--sans); font-size:1.15rem; color:var(--ink); outline:none;
}
.cloze-input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.cloze-res{margin-top:var(--s5); padding:var(--s3) var(--s4); border-radius:var(--r-m); font-size:.98rem; line-height:1.5}
.cloze-res.ok{background:var(--ok-soft); color:var(--ok); font-weight:500}
.cloze-res.no{background:var(--bad-soft); color:var(--bad)}
.cloze-full{margin-top:var(--s3); font-size:1.05rem; line-height:1.55; color:var(--ink-2)}

/* ---------- маршрут ---------- */
.path{display:grid; gap:var(--s2)}
.pstep{display:flex; gap:var(--s4); padding:var(--s5); border:1px solid var(--line);
  border-radius:var(--r-m); background:var(--surface)}
.pstep.done{background:none; border-color:transparent; padding:var(--s3) var(--s5); opacity:.75}
.pstep.done .tiny, .pstep.done .pgoal{display:none}
.pstep.now{border-color:var(--accent-line); background:var(--accent-soft)}
.pmark{flex:none; width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  background:var(--sunk); color:var(--ink-2); font-size:.85rem; font-weight:600}
.pstep.done .pmark{background:var(--ok-soft); color:var(--ok)}
.pstep.now .pmark{background:var(--accent); color:#fff}
.pbody{flex:1}
.ptitle{font-weight:500; font-size:1.02rem; line-height:1.35}
.pnow{display:inline-block; margin-left:var(--s2); font-size:.66rem; letter-spacing:.06em;
  text-transform:uppercase; color:var(--accent); font-weight:700; vertical-align:middle}
.pgoal{font-size:.84rem; color:var(--ink-2); line-height:1.45}

/* ---------- авторство ---------- */
.author{text-align:center; margin:var(--s7) 0 var(--s6); padding-top:var(--s6); border-top:1px solid var(--line)}
.author .cat{margin:0 auto var(--s3); display:block; opacity:.9}
.a-name{font-family:var(--serif); font-size:1.15rem; letter-spacing:-.01em}
.a-line{font-size:.84rem; color:var(--ink-2); margin-top:var(--s1)}

/* ---------- прочее ---------- */
.empty{text-align:center; padding:var(--s7) var(--s5)}
.empty .mark{width:52px; height:52px; border-radius:50%; background:var(--ok-soft); color:var(--ok);
  display:grid; place-items:center; margin:0 auto var(--s4); font-size:1.4rem}

/* ---------- финал сессии ---------- */
.finish{text-align:center; padding:var(--s6) 0 var(--s7); animation:rise .5s cubic-bezier(.2,.75,.25,1)}
.finish .cat{margin:0 auto var(--s4); display:block; animation:pop .5s cubic-bezier(.2,1.5,.4,1) .1s both}
.finish h1{margin-bottom:var(--s1)}
.won{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l);
  padding:var(--s5); text-align:left; animation:rise .5s cubic-bezier(.2,.75,.25,1) .18s both;
}
.won-hd{font-size:.78rem; letter-spacing:.06em; text-transform:uppercase; color:var(--ok); font-weight:600; margin-bottom:var(--s3)}
.won-row{padding:var(--s3) 0; border-bottom:1px solid var(--line)}
.won-row:last-child{border-bottom:0}
.won-w{display:block; font-family:var(--serif); font-size:1.32rem; line-height:1.3}
.won-tr{display:block; color:var(--ink-2); font-size:.92rem; line-height:1.4; margin-top:2px}
.won-iv{display:block; font-size:.76rem; color:var(--ink-3); line-height:1.4; margin-top:5px}
@keyframes rise{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.6)}to{opacity:1; transform:scale(1)}}
@media (prefers-reduced-motion: reduce){
  .finish,.finish .mark,.won{animation:none}
}
.sw{display:flex; align-items:flex-start; gap:var(--s4); padding:var(--s4) 0; border-bottom:1px solid var(--line); cursor:pointer; line-height:1.45}
.sw:last-child{border-bottom:0}
.sw input{width:20px; height:20px; accent-color:var(--ink); margin-top:2px; flex:none}
.seg{display:flex; gap:var(--s1); background:var(--sunk); padding:3px; border-radius:var(--r-m)}
.seg button{flex:1; border:0; background:none; border-radius:9px; padding:9px; font-size:.85rem; color:var(--ink-2); min-height:42px}
.seg button.on{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(26,26,24,.06)}
input[type=range]{width:100%; accent-color:var(--ink)}
kbd{background:var(--sunk); border-radius:5px; padding:1px 6px; font-family:inherit; font-size:.85em}
</style>
</head>

 why:`В русском мы передаём эту информацию порядком слов и интонацией: «В комнату вошла <u>женщина</u>» (новая, впервые) против «<u>Женщина</u> вошла в комнату» (та самая, известная). Английский порядок слов жёсткий, ему нужен отдельный маркер — им и стал артикль.<br><br><b>a/an</b> = «один из многих, ты его пока не знаешь».<br><b>the</b> = «тот самый, мы оба понимаем какой».<br><b>без артикля</b> = про категорию вообще или про неисчисляемое.`,
 pairs:[
  ['I need <b>a</b> doctor.','Мне нужен какой-нибудь врач.'],
  ['I need <b>the</b> doctor.','Мне нужен тот самый врач.']
 ],
 pairsNote:'Первую фразу говорят, когда стало плохо. Вторую — когда врач уже есть, и он нужен именно этот.',
 trap:'Самая частая ошибка русских — пропускать артикль вообще. Для англоговорящего <s>I bought car</s> звучит примерно как «я купила автомобиль-в-принципе». Правило-костыль на первое время: перед исчисляемым существительным в единственном числе <b>всегда</b> что-то стоит — a, the, my, this, one. Голым оно не бывает.',
 examples:[
  ['I saw a cat. The cat was black.','Я видела кошку. Кошка была чёрная.'],
  ['Close the door, please.','Закрой дверь, пожалуйста. (мы оба знаем какую)'],
  ['I love music.','Я люблю музыку. (вообще, как явление)'],
  ['She is a teacher.','Она учительница. (одна из)']
 ],
 quiz:[
  {q:'«Я купила книгу» (какую-то, впервые упоминаю):',o:['I bought book','I bought a book','I bought the book'],a:1,e:'Первое упоминание исчисляемого предмета — a/an.'},
  {q:'«Солнце светит»:',o:['Sun is shining','A sun is shining','The sun is shining'],a:2,e:'Солнце одно на всех — уникальные объекты берут the. Так же: the moon, the sky, the internet.'},
  {q:'«Я работаю учителем»:',o:['I work as a teacher','I work as teacher','I work as the teacher'],a:0,e:'Профессия — «один из» представителей. Всегда a/an.'}
 ]
},
{
 id:'g-present', title:'Present Simple vs Continuous', sub:'Вообще или прямо сейчас',
 core:'Simple — про то, что бывает регулярно. Continuous — про то, что происходит в этот момент.',
 why:`Русский глагол «читаю» покрывает обе ситуации: «я читаю книги по вечерам» и «не мешай, я читаю». Английский разводит их разными формами, потому что для него это разные типы событий: <b>свойство</b> человека против <b>процесса</b> в кадре.<br><br><b>I read</b> — характеристика, привычка, факт.<br><b>I am reading</b> — прямо сейчас, временно, в процессе.`,
 pairs:[
  ['I work in IT.','Я работаю в IT. (вообще, это моя сфера)'],
  ['I am working right now.','Я работаю прямо сейчас. (в данную минуту)']
 ],
 pairsNote:'Обе фразы по-русски звучат одинаково. По-английски — нет.',
 trap:'Глаголы состояния (know, want, like, understand, need, believe, see, hear) в Continuous не ставят: <s>I am knowing</s>, <s>I am wanting</s>. Почему: знать — это не процесс, который можно начать и прервать, это состояние. Правильно: <i>I know</i>, <i>I want</i>.',
 examples:[
  ['She drinks coffee every morning.','Она пьёт кофе каждое утро.'],
  ['She is drinking coffee now.','Она сейчас пьёт кофе.'],
  ['I do not understand this rule.','Я не понимаю это правило.'],
  ['What are you doing?','Что ты делаешь? (сейчас)']
 ],
 quiz:[
  {q:'«Я учу новые слова каждый день»:',o:['I am learning new words every day','I learn new words every day','I learning new words every day'],a:1,e:'Every day — прямое указание на регулярность, а регулярное действие всегда идёт в Present Simple. Форма без am или is вообще не существует: -ing не бывает сам по себе.'},
  {q:'«Он сейчас спит»:',o:['He sleeps now','He is sleeping now','He sleeping now'],a:1,e:'Процесс в текущий момент — Continuous: be + -ing. Без am/is/are форма не существует.'},
  {q:'Где ошибка?',o:['I am understanding you','I understand you','Both are fine'],a:0,e:'Understand — глагол состояния, Continuous не образует.'}
 ]
},
{
 id:'g-do', title:'Вопросы и do / does', sub:'Откуда берётся лишний глагол',
 core:'Английский вопрос требует, чтобы что-то стояло перед подлежащим. Если ставить нечего — зовут do.',
 why:`Русский делает вопрос интонацией: «Ты любишь кофе?» отличается от «Ты любишь кофе» только голосом. Английский так не может — у него, помнишь, порядок слов несёт смысл, менять его свободно нельзя.<br><br>Поэтому вопрос строится инверсией: вспомогательный глагол выходит вперёд. Если в предложении уже есть <i>is / are / can / will / have</i> — вперёд выходит он. Если нет никого — вызывают дежурного: <b>do / does / did</b>.`,
 pairs:[
  ['You like coffee.','Утверждение.'],
  ['<b>Do</b> you like coffee?','Вопрос. Появился do.']
 ],
 pairsNote:'Do не переводится. Это чисто служебная деталь конструкции.',
 trap:'Как только вышел do/does/did — основной глагол теряет все окончания. <s>Does she likes?</s> — нет, <i>Does she like?</i> Показатель времени и лица уже унесён на do, дублировать нельзя. Так же: <s>Did you went?</s> → <i>Did you go?</i>',
 examples:[
  ['Do you speak English?','Ты говоришь по-английски?'],
  ['Does he know about it?','Он знает об этом?'],
  ['Did you see the message?','Ты видела сообщение?'],
  ['Where do you live?','Где ты живёшь?'],
  ['I do not want to go.','Я не хочу идти.']
 ],
 quiz:[
  {q:'«Он работает здесь?»',o:['Does he works here?','Does he work here?','Do he work here?'],a:1,e:'Does забирает -s себе, основной глагол остаётся голым.'},
  {q:'«Ты вчера её видела?»',o:['Did you saw her yesterday?','Did you see her yesterday?','Do you saw her yesterday?'],a:1,e:'Did уже показал прошедшее время. See остаётся в начальной форме.'},
  {q:'«Она не любит рано вставать»',o:['She not like early','She does not like getting up early','She do not like getting up early'],a:1,e:'Третье лицо единственного числа — does, не do.'}
 ]
},
{
 id:'g-past', title:'Past Simple', sub:'Прошедшее время и неправильные глаголы',
 core:'Действие закончилось в прошлом, и известно когда. Глагол получает -ed или меняется целиком.',
 why:`Здесь английский проще русского: нет рода («я пошла» / «я пошёл» — оба <i>I went</i>), нет вида. Но есть список из ~150 неправильных глаголов, которые не берут -ed, а меняют корень: go→went, see→saw, take→took.<br><br>Почему они такие: это самые древние и самые частые глаголы языка. Частое употребление защищает форму от выравнивания — их произносят слишком часто, чтобы забыть.`,
 pairs:[
  ['work → work<b>ed</b>','Правильный: просто -ed.'],
  ['go → <b>went</b>','Неправильный: другое слово.']
 ],
 pairsNote:'Неправильных мало, но они самые ходовые. Учить придётся списком — логики нет.',
 trap:'В отрицаниях и вопросах прошедшее время уходит на did, а глагол возвращается в начальную форму: <s>I didn\'t went</s> → <i>I didn\'t go</i>. Ошибка живучая, потому что мозг хочет отметить прошедшее дважды.',
 examples:[
  ['I went to the doctor yesterday.','Я вчера ходила к врачу.'],
  ['She wrote me a long letter.','Она написала мне длинное письмо.'],
  ['We did not know about it.','Мы не знали об этом.'],
  ['They bought a house last year.','Они купили дом в прошлом году.']
 ],
 quiz:[
  {q:'Прошедшее от "take":',o:['taked','took','taken'],a:1,e:'took — Past Simple. taken — третья форма, для Perfect и пассива.'},
  {q:'«Я не видела его»:',o:['I did not saw him','I did not see him','I not saw him'],a:1,e:'Did уносит время на себя, see остаётся в начальной форме.'},
  {q:'Прошедшее от "read":',o:['readed','red','read'],a:2,e:'Пишется так же — read, но читается /red/. Единственный способ различить — по контексту. Для тебя это хорошая новость: на письме разницы нет.'}
 ]
},
{
 id:'g-perfect', title:'Present Perfect', sub:'Время, которого в русском нет',
 core:'Действие в прошлом, но важен его результат СЕЙЧАС. Когда именно — неважно и не называется.',
 why:`Это главная точка, где русская модель времени ломается. У нас два кадра: настоящее и прошлое. У англичан есть третий — <b>прошлое, дотянувшееся до настоящего</b>.<br><br>Форма: <b>have/has + третья форма глагола</b>.<br><br>Тест: если можно приписать «и вот результат» — это Perfect. Если фраза отвечает на «когда?» конкретной датой — это Past Simple. Слова <i>yesterday, in 2019, last week</i> моментально запрещают Perfect.`,
 pairs:[
  ['I lost my keys.','Потеряла. (просто факт из прошлого)'],
  ['I have lost my keys.','Потеряла — и сейчас без ключей. Вот проблема.']
 ],
 pairsNote:'По-русски обе фразы одинаковы. Разница живёт только в английском.',
 trap:'Нельзя: <s>I have seen him yesterday</s>. Как только назвала точное время в прошлом — обязан быть Past Simple: <i>I saw him yesterday</i>. Perfect и конкретная дата несовместимы физически: Perfect как раз и говорит «время неважно».',
 examples:[
  ['I have finished the work.','Я закончила работу. (и вот она готова)'],
  ['She has never been to London.','Она никогда не была в Лондоне. (за всю жизнь до сих пор)'],
  ['Have you read this book?','Ты читала эту книгу? (когда-либо)'],
  ['I have lived here for ten years.','Я живу здесь десять лет. (и до сих пор живу)']
 ],
 quiz:[
  {q:'«Я закончила, вот результат»:',o:['I finished','I have finished','I am finishing'],a:1,e:'Акцент на текущем результате — Present Perfect.'},
  {q:'«Я видела его вчера»:',o:['I have seen him yesterday','I saw him yesterday','I have saw him yesterday'],a:1,e:'Есть yesterday — только Past Simple. Perfect с конкретной датой не сочетается.'},
  {q:'«Я живу здесь пять лет (и сейчас живу)»:',o:['I live here for five years','I have lived here for five years','I lived here five years'],a:1,e:'Действие началось в прошлом и продолжается — Present Perfect с for/since.'}
 ]
},
{
 id:'g-modal', title:'Модальные глаголы', sub:'can, must, should и их странности',
 core:'Модальные не изменяются и требуют после себя голый глагол — без to и без окончаний.',
 why:`Модальные глаголы — древний обломок в языке. Они не берут -s в третьем лице (<i>he can</i>, не <s>he cans</s>), не образуют форм с do (<i>Can you?</i>, не <s>Do you can?</s>) и не терпят после себя <i>to</i>.<br><br>Смысловая шкала обязательности:<br><b>must</b> — обязан, нет выбора<br><b>have to</b> — надо из-за внешних обстоятельств<br><b>should</b> — стоило бы, совет<br><b>can</b> — умею / можно<br><b>may/might</b> — возможно`,
 pairs:[
  ['<s>She cans swim.</s>','She <b>can</b> swim.'],
  ['<s>I must to go.</s>','I <b>must</b> go.']
 ],
 pairsNote:'Никаких -s и никакого to. Модальные живут по своим законам.',
 trap:'<b>must not</b> ≠ «не должен», а «категорически нельзя». Если нужно сказать «не обязан» — это <i>don\'t have to</i>. Разница серьёзная: <i>You mustn\'t call him</i> = запрещаю звонить. <i>You don\'t have to call him</i> = можешь не звонить.',
 examples:[
  ['I can read English texts.','Я умею читать английские тексты.'],
  ['You should rest.','Тебе стоит отдохнуть.'],
  ['We must be careful.','Мы должны быть осторожны.'],
  ['You don\'t have to come.','Тебе не обязательно приходить.'],
  ['It might rain.','Возможно, будет дождь.']
 ],
 quiz:[
  {q:'«Он умеет плавать»:',o:['He cans swim','He can swim','He can to swim'],a:1,e:'Модальные глаголы не берут -s в третьем лице и не терпят после себя to. Обе особенности — следствие их древности: они застыли в языке раньше, чем сложились эти правила.'},
  {q:'«Тебе не обязательно это делать»:',o:['You mustn\'t do it','You don\'t have to do it','You shouldn\'t do it'],a:1,e:'mustn\'t = запрещено. Отсутствие обязанности — don\'t have to.'},
  {q:'«Можно вопрос?»',o:['Can I ask a question?','Do I can ask a question?','I can ask a question?'],a:0,e:'Вопрос с модальным — простая инверсия, do не нужен.'}
 ]
},
{
 id:'g-future', title:'Будущее: will и going to', sub:'Решение сейчас или план заранее',
 core:'will — решила в момент речи. going to — планировала раньше.',
 why:`В русском одна форма будущего на все случаи: «я позвоню». Английский различает <b>источник</b> намерения.<br><br><b>will</b> — решение родилось прямо сейчас, спонтанно, или это прогноз/обещание.<br><b>be going to</b> — намерение уже было до разговора, есть план.<br><b>Present Continuous</b> — договорённость с конкретным временем: <i>I'm meeting her at six</i>.`,
 pairs:[
  ['— The phone is ringing. — I\'ll get it.','Решила сию секунду → will.'],
  ['I\'m going to call her tonight.','Уже планировала → going to.']
 ],
 pairsNote:'Ошибка тут не мешает пониманию, но выдаёт неноситель мгновенно.',
 trap:'После <i>if</i> и <i>when</i> будущее время не ставят, хотя по смыслу оно будущее: <s>If it will rain</s> → <i>If it rains, I\'ll stay home</i>. Русский тут говорит «если будет дождь», и рука тянется написать will.',
 examples:[
  ['I think it will be fine.','Думаю, всё будет хорошо.'],
  ['I\'m going to learn English this year.','Я собираюсь выучить английский в этом году.'],
  ['When I finish, I\'ll call you.','Когда закончу, я тебе позвоню.'],
  ['We\'re meeting at seven.','Мы встречаемся в семь. (договорились)']
 ],
 quiz:[
  {q:'«Если завтра будет дождь, я останусь дома»:',o:['If it will rain tomorrow, I stay home','If it rains tomorrow, I\'ll stay home','If it rains tomorrow, I stay home'],a:1,e:'После if — настоящее время, в главной части — will.'},
  {q:'Телефон звонит, ты говоришь «я отвечу»:',o:['I\'m going to answer','I\'ll answer','I answer'],a:1,e:'Решение родилось прямо сейчас, в момент разговора, — это всегда will. Going to здесь звучало бы странно: оно означает «я планировала ответить на звонок заранее».'},
  {q:'«Я собираюсь начать бегать» (давно решила):',o:['I will start running','I\'m going to start running','I start running'],a:1,e:'Намерение возникло до разговора, план уже есть — going to. Will передал бы, что решение принято сию секунду, что противоречит условию «давно решила».'}
 ]
},
{
 id:'g-prep', title:'Предлоги времени и места', sub:'in / on / at — от большого к малому',
 core:'Один принцип на оба случая: at — точка, on — поверхность или день, in — внутри объёма или периода.',
 why:`Русские предлоги делятся иначе, поэтому прямой перевод не работает: «в понедельник» → <i>on</i> Monday, а не <s>in Monday</s>.<br><br>Работающая модель — <b>масштаб</b>:<br><b>at</b> — самое точное: at 6 o'clock, at the door, at home<br><b>on</b> — плоскость или конкретный день: on the table, on Monday<br><b>in</b> — объём или большой период: in the box, in May, in 2026`,
 pairs:[
  ['at 7:30 → on Friday → in July','Время: от точки к периоду.'],
  ['at the corner → on the street → in the city','Место: от точки к объёму.']
 ],
 pairsNote:'Одна и та же логика в обеих строках. Запомнить нужно шкалу, а не сорок правил.',
 trap:'Исключения, которые придётся просто выучить: <i>at night</i> (но <i>in the morning / in the evening</i>), <i>at the weekend</i> (брит.) / <i>on the weekend</i> (амер.), и <i>home</i> без предлога после глаголов движения: <i>I go home</i>, не <s>to home</s>.',
 examples:[
  ['The meeting is at 3 p.m. on Tuesday.','Встреча во вторник в три.'],
  ['I was born in 1990.','Я родилась в 1990.'],
  ['She lives in a small town.','Она живёт в маленьком городке.'],
  ['See you in the morning.','Увидимся утром.'],
  ['I\'ll be at home at night.','Ночью я буду дома.']
 ],
 quiz:[
  {q:'«В понедельник»:',o:['in Monday','on Monday','at Monday'],a:1,e:'Конкретный день недели или дата — всегда on: on Monday, on 5 August, on my birthday. Русское «в понедельник» провоцирует поставить in, но это разные системы.'},
  {q:'«В восемь часов»:',o:['at eight o\'clock','in eight o\'clock','on eight o\'clock'],a:0,e:'Точное время на часах — самая мелкая единица шкалы, поэтому at: at eight, at 6:30, at midnight. Шкала работает так: at (точка) → on (день) → in (месяц, год).'},
  {q:'«Я иду домой»:',o:['I go to home','I go home','I go in home'],a:1,e:'Home после глаголов движения работает как наречие — предлог не нужен.'}
 ]
},
{
 id:'g-there', title:'There is / There are', sub:'Как сказать «есть», когда подлежащего нет',
 core:'Английскому предложению нужно подлежащее всегда. Если по смыслу его нет, ставят пустое there.',
 why:`«В комнате стол» — нормальное русское предложение без подлежащего. Английский так не умеет: место подлежащего пустым не оставляют. Поэтому туда ставят служебное <b>there</b>, которое ничего не значит и не переводится.<br><br>Глагол согласуется не с there, а с тем, что идёт <b>после</b>: <i>There <u>is</u> a table</i>, но <i>There <u>are</u> tables</i>. В прошедшем — there was / there were.`,
 pairs:[
  ['<s>In the room is a table.</s>','<b>There is</b> a table in the room.'],
  ['<s>There is many people.</s>','<b>There are</b> many people.']
 ],
 pairsNote:'Слева — как хочет построить русский мозг. Справа — как надо.',
 trap:'Слово there живёт двойной жизнью: в этой конструкции оно пустое, а само по себе значит «там». В <i>There is a pharmacy there</i> первое there — служебное, второе — место. Из-за этого русские часто переводят конструкцию как «там есть», хотя обычно это просто «есть».',
 examples:[
  ['There is a problem.','Есть проблема.'],
  ['There are two bedrooms.','Есть две спальни.'],
  ['Is there a pharmacy near here?','Здесь рядом есть аптека?'],
  ['There was no hot water.','Горячей воды не было.']
 ],
 quiz:[
  {q:'«В номере есть холодильник»:',o:['In the room is a fridge','There is a fridge in the room','There has a fridge in the room'],a:1,e:'Конструкция наличия строится только через there is. Have здесь не используется: у комнаты ничего не «имеется», предмет просто существует в ней.'},
  {q:'«Здесь рядом есть аптека?»',o:['Is there a pharmacy near here?','Has there a pharmacy near here?','There is a pharmacy near here?'],a:0,e:'Вопрос делается инверсией: is выходит вперёд перед there. Порядок слов менять на обычный вопросительный не нужно.'},
  {q:'«На улице много людей»:',o:['There is many people outside','There are many people outside','There have many people outside'],a:1,e:'Глагол согласуется с тем, что стоит после конструкции. People — множественное число, значит are, хотя формально подлежащее — пустое there.'}
 ]
},
{
 id:'g-some', title:'some, any и no', sub:'Почему в вопросе нельзя оставить some',
 core:'some — в утверждениях, any — в вопросах и отрицаниях. Двойного отрицания в английском нет.',
 why:`Русские «немного», «какой-нибудь», «никакой» свободно ходят по любым предложениям. Английский жёстко связал выбор с типом фразы:<br><br><b>some</b> — утверждение: <i>I have some money.</i><br><b>any</b> — вопрос и отрицание: <i>Do you have any money? I don't have any money.</i><br><b>no</b> — отрицание, но глагол при этом остаётся положительным: <i>I have no money.</i>`,
 pairs:[
  ['I have <b>some</b> questions.','Утверждение.'],
  ['Do you have <b>any</b> questions?','Вопрос.']
 ],
 pairsNote:'Одно и то же слово «вопросы», а служебное слово разное — потому что разный тип предложения.',
 trap:'В русском отрицание удваивается и это норма: «я ничего не знаю» — два отрицания подряд. В английском отрицание в предложении ровно одно. <s>I don\'t know nothing</s> — грубая ошибка. Правильно: <i>I don\'t know anything</i> или <i>I know nothing</i>.',
 examples:[
  ['I need some help.','Мне нужна помощь.'],
  ['Do you have any questions?','У вас есть вопросы?'],
  ['There isn\'t any milk.','Молока нет.'],
  ['I have no idea.','Понятия не имею.'],
  ['Would you like some tea?','Хотите чаю?']
 ],
 quiz:[
  {q:'«У меня нет денег»:',o:['I don\'t have no money','I don\'t have any money','I have not no money'],a:1,e:'Отрицание в английском предложении может быть только одно. Здесь его несёт don\'t, поэтому дальше идёт any, а не no.'},
  {q:'«Хотите чаю?» (предлагаете):',o:['Would you like any tea?','Would you like some tea?','Would you like no tea?'],a:1,e:'Важное исключение: в предложениях и просьбах ставят some, а не any. Any в вопросе означает настоящую неизвестность, а угощая, вы не сомневаетесь в существовании чая.'},
  {q:'«В номере нет полотенец»:',o:['There are no towels in the room','There are not no towels','There aren\'t no towels'],a:0,e:'Возможны два варианта: there are no towels либо there aren\'t any towels. Совмещать оба отрицания нельзя.'}
 ]
},
{
 id:'g-quant', title:'much, many и a lot of', sub:'Счётное и несчётное — деление, которого нет в русском',
 core:'many — с тем, что можно посчитать поштучно. much — с тем, что нельзя. a lot of — с обоими.',
 why:`В русском «много» одно на всё: много книг, много воды. Английский делит существительные на два класса:<br><br><b>Счётные</b> — есть множественное число: book → books, person → people. С ними many, few, a few.<br><b>Несчётные</b> — вещество, масса, абстракция: water, money, time, information. Множественного числа у них нет, глагол при них в единственном. С ними much, little, a little.<br><br>В сомнительном случае выручает <b>a lot of</b> — оно подходит к обоим.`,
 pairs:[
  ['many books, many people','счётные — множественное число'],
  ['much water, much time','несчётные — всегда единственное']
 ],
 pairsNote:'Разница не в смысле, а в том, к какому классу относится существительное.',
 trap:'Слова money, information, advice, news, hair, furniture, bread в английском несчётные, хотя в русском прекрасно считаются. Отсюда ошибки <s>many money</s>, <s>an advice</s>, <s>news are good</s>. Правильно: <i>much money</i>, <i>a piece of advice</i>, <i>the news is good</i>.',
 examples:[
  ['How many people are coming?','Сколько человек придёт?'],
  ['I don\'t have much time.','У меня мало времени.'],
  ['A lot of tourists come in summer.','Летом приезжает много туристов.'],
  ['There are a few shops nearby.','Рядом есть несколько магазинов.'],
  ['Just a little milk, please.','Совсем немного молока, пожалуйста.']
 ],
 quiz:[
  {q:'«У меня мало времени»:',o:['I don\'t have many time','I don\'t have much time','I have few time'],a:1,e:'Time — несчётное существительное, поэтому much. Many сочетается только с тем, что имеет множественное число.'},
  {q:'«Новости хорошие»:',o:['The news is good','The news are good','The newses are good'],a:0,e:'News выглядит как множественное число из-за -s, но это несчётное существительное в единственном числе. Поэтому is, и формы newses не существует.'},
  {q:'«Он дал мне хороший совет»:',o:['He gave me a good advice','He gave me good advice','He gave me good advices'],a:1,e:'Advice несчётное: артикля a и окончания -s не берёт. Если нужно подчеркнуть один совет, говорят a piece of advice.'}
 ]
},
{
 id:'g-compare', title:'Степени сравнения', sub:'Когда -er, а когда more',
 core:'Короткое слово получает окончание, длинное — служебное слово more. Выбор решает длина, а не смысл.',
 why:`В русском степень сравнения почти всегда делается окончанием: дешёвый → дешевле. Английский делит по числу слогов:<br><br><b>Один слог</b> → -er / -est: cheap → cheaper → the cheapest.<br><b>Два слога на -y</b> → -ier / -iest: easy → easier → the easiest.<br><b>Три слога и больше</b> → more / the most: expensive → more expensive → the most expensive.<br><br>В превосходной степени почти всегда стоит <b>the</b>: это самый-единственный предмет, а уникальность — работа определённого артикля.`,
 pairs:[
  ['cheap → cheaper → the cheapest','короткое слово'],
  ['expensive → more expensive → the most expensive','длинное слово']
 ],
 pairsNote:'Правило механическое: считаешь слоги — выбираешь способ.',
 trap:'Нельзя усиливать дважды: <s>more cheaper</s>, <s>the most cheapest</s>. Один способ на слово. И четыре формы придётся выучить, они не подчиняются правилу: good → better → the best, bad → worse → the worst, many → more → the most, far → further.',
 examples:[
  ['This one is cheaper.','Этот дешевле.'],
  ['It is the best restaurant here.','Это лучший ресторан здесь.'],
  ['My English is better than last year.','Мой английский лучше, чем в прошлом году.'],
  ['Today is warmer than yesterday.','Сегодня теплее, чем вчера.'],
  ['That was the most difficult part.','Это была самая трудная часть.']
 ],
 quiz:[
  {q:'Сравнительная степень от good:',o:['gooder','better','more good'],a:1,e:'Good — одно из четырёх слов с неправильными степенями сравнения. Правило слогов на него не действует, форму better нужно просто запомнить.'},
  {q:'«Дешевле, чем этот»:',o:['more cheap than this one','cheaper than this one','cheapest than this one'],a:1,e:'Cheap односложное, поэтому берёт окончание -er. Превосходная степень cheapest со словом than не сочетается — сравнивают через сравнительную.'},
  {q:'«Самый интересный музей»:',o:['the interestingest museum','the more interesting museum','the most interesting museum'],a:2,e:'Interesting длинное, поэтому the most. Окончание -est к таким словам не приклеивают, а more даёт сравнительную степень, а не превосходную.'}
 ]
},
{
 id:'g-pastcont', title:'Past Continuous', sub:'Фон и событие на этом фоне',
 core:'Past Simple — что случилось. Past Continuous — что уже шло в этот момент.',
 why:`Русский вид (делала / сделала) частично совпадает с этой парой, но не полностью, поэтому на него нельзя опираться. Надёжнее думать про <b>кадр</b>:<br><br><b>Past Continuous</b> (was/were + -ing) — процесс, который уже длился. Это фон, декорация.<br><b>Past Simple</b> — точечное событие. Оно происходит <i>на</i> фоне и обычно его прерывает.<br><br>Отсюда типичная связка: <i>I <u>was reading</u> when he <u>called</u></i> — длилось чтение, вклинился звонок.`,
 pairs:[
  ['I <b>was reading</b> when he <b>called</b>.','Читала — фон. Позвонил — событие.'],
  ['I <b>read</b> and then he <b>called</b>.','Два события подряд, фона нет.']
 ],
 pairsNote:'Одни и те же слова, но в первом случае действия наложены, во втором идут друг за другом.',
 trap:'Глаголы состояния — know, want, like, understand, need, believe — в Continuous не ставят ни в настоящем, ни в прошедшем. <s>I was knowing</s> невозможно; правильно <i>I knew</i>. Причина та же, что и в настоящем времени: знание не процесс, который можно начать и оборвать.',
 examples:[
  ['I was cooking when you called.','Я готовила, когда ты позвонил.'],
  ['It was raining all day.','Весь день шёл дождь.'],
  ['What were you doing at six?','Что ты делала в шесть?'],
  ['She was waiting at the station.','Она ждала на вокзале.']
 ],
 quiz:[
  {q:'«Я спала, когда ты пришёл»:',o:['I slept when you came','I was sleeping when you came','I was sleep when you came'],a:1,e:'Сон длился, приход его прервал — значит фон в Continuous, событие в Simple. Форма was sleep не существует: после was обязательно идёт -ing.'},
  {q:'«Когда я вышла, шёл дождь»:',o:['When I went out, it rained','When I went out, it was raining','When I went out, it is raining'],a:1,e:'Дождь уже шёл к моменту выхода — это фон, а фон всегда в Past Continuous. Вариант с Simple означал бы, что дождь начался после того, как вы вышли.'},
  {q:'Где ошибка?',o:['I was wanting to call you','I wanted to call you','Обе фразы верны'],a:0,e:'Want — глагол состояния, форм с -ing он не образует. Это то же ограничение, что и в настоящем времени, только в прошедшем.'}
 ]
},
{
 id:'g-if', title:'Условные предложения', sub:'Три «если» вместо одного',
 core:'Английский различает, насколько условие реально. Русское «если» одно на все случаи.',
 why:`<b>Нулевой тип</b> — всегда так устроено: <i>If you heat water, it boils.</i> Оба глагола в настоящем.<br><br><b>Первый тип</b> — реальное будущее: <i>If it rains, I will stay home.</i> После if настоящее, в главной части will.<br><br><b>Второй тип</b> — воображаемое, неправда: <i>If I had time, I would go.</i> Прошедшее после if, would в главной части. Времени нет — фраза про фантазию, а не про план.`,
 pairs:[
  ['If it <b>rains</b>, I <b>will stay</b> home.','Реально: дождь возможен.'],
  ['If I <b>had</b> time, I <b>would go</b>.','Нереально: времени нет.']
 ],
 pairsNote:'Прошедшее время во втором типе не про прошлое — оно сигнал «это выдумка».',
 trap:'После if будущее время не ставится, хотя по смыслу оно будущее. <s>If it will rain</s> — ошибка, которую делают почти все русскоговорящие, потому что по-русски мы говорим «если будет дождь». Правильно: <i>If it rains, I\'ll stay home.</i> То же правило действует после when, before, until, as soon as.',
 examples:[
  ['If it rains tomorrow, I\'ll stay home.','Если завтра будет дождь, я останусь дома.'],
  ['If you need help, call me.','Если понадобится помощь, позвони мне.'],
  ['If I were you, I would wait.','На твоём месте я бы подождала.'],
  ['When I finish, I\'ll call you.','Когда закончу, я тебе позвоню.']
 ],
 quiz:[
  {q:'«Если нагреть воду, она закипает» (всегда так):',o:['If you will heat water, it boils','If you heat water, it boils','If you heat water, it will boil'],a:1,e:'Это нулевой тип: описывается закон природы, который работает всегда. Оба глагола стоят в настоящем времени, будущее здесь неуместно ни в одной из частей.'},
  {q:'«На твоём месте я бы подождала»:',o:['If I was you, I will wait','If I were you, I would wait','If I am you, I would wait'],a:1,e:'Это второй тип: ситуация воображаемая. В устойчивом обороте if I were you форма were используется для всех лиц, включая I.'},
  {q:'«Когда закончу, позвоню»:',o:['When I will finish, I\'ll call','When I finish, I\'ll call','When I finish, I call'],a:1,e:'После when действует то же правило, что и после if: будущее время туда не ставят, хотя действие относится к будущему.'}
 ]
},
{
 id:'g-passive', title:'Пассивный залог', sub:'Когда важно что случилось, а не кто сделал',
 core:'be + третья форма глагола. Подлежащее не действует, а испытывает действие на себе.',
 why:`В русском страдательный залог делается по-разному: «кошелёк украли» (безличное), «дом построен» (краткое причастие), «книга читается» (частица -ся). Английский делает это одним способом — <b>be + третья форма</b>, а время показывает сам be:<br><br><i>is stolen</i> — крадут, <i>was stolen</i> — украли, <i>will be stolen</i> — украдут.<br><br>Кто сделал, добавляют через <b>by</b>, но чаще не добавляют вовсе: пассив и нужен тогда, когда деятель неизвестен или неважен.`,
 pairs:[
  ['Someone stole my wallet.','Активный залог: есть виновник.'],
  ['My wallet <b>was stolen</b>.','Пассивный: важен факт, а не кто.']
 ],
 pairsNote:'Вторая фраза — то, что вы скажете в полиции. Она короче и не требует знать виновника.',
 trap:'Пассив легко спутать с прошедшим временем, потому что в обоих есть форма глагола на -ed. Отличие простое: в пассиве обязательно стоит be. <i>He finished the work</i> — он закончил. <i>The work was finished</i> — работу закончили. Без was второе предложение не собирается.',
 examples:[
  ['My flight was cancelled.','Мой рейс отменили.'],
  ['Breakfast is served from seven.','Завтрак подаётся с семи.'],
  ['The room is cleaned every day.','Номер убирают каждый день.'],
  ['This shop was opened in 1990.','Этот магазин открыли в 1990 году.']
 ],
 quiz:[
  {q:'«У меня украли кошелёк»:',o:['My wallet stole','My wallet was stolen','My wallet was stole'],a:1,e:'Пассив требует be плюс третью форму глагола. У steal третья форма — stolen, а не stole: stole это прошедшее время активного залога.'},
  {q:'«Завтрак подаётся с семи»:',o:['Breakfast serves from seven','Breakfast is served from seven','Breakfast serving from seven'],a:1,e:'Завтрак не подаёт сам себя, действие направлено на него, поэтому нужен пассив: is плюс третья форма served.'},
  {q:'«Номер убирают каждый день»:',o:['The room cleans every day','The room is cleaned every day','The room is cleaning every day'],a:1,e:'Русское безличное «убирают» передаётся пассивом. Вариант is cleaning означал бы, что номер сам занят уборкой.'}
 ]
},
{
 id:'g-ing', title:'Герундий и инфинитив', sub:'Почему после одних глаголов -ing, а после других to',
 core:'Выбор зависит от первого глагола. Логики нет, но список короткий и делится на три группы.',
 why:`В русском после любого глагола идёт инфинитив: «люблю читать», «закончил читать», «хочу читать». Английский требует разного:<br><br><b>Только -ing</b>: enjoy, finish, mind, avoid, keep, practise, suggest.<br><b>Только to</b>: want, need, decide, hope, promise, learn, plan, would like.<br><b>И так, и так</b>: like, love, hate, start, begin, continue — смысл почти не меняется.<br><br>Отдельное железное правило: <b>после любого предлога — только -ing</b>. Предлог перед to-инфинитивом невозможен.`,
 pairs:[
  ['I enjoy <b>reading</b>.','enjoy требует -ing'],
  ['I want <b>to read</b>.','want требует to']
 ],
 pairsNote:'Смысл в обеих фразах близкий, а форма разная — решает первый глагол.',
 trap:'Ошибка возникает там, где в русском стоит инфинитив, а в английском предлог: <i>interested in learning</i>, <i>good at cooking</i>, <i>instead of waiting</i>, <i>before leaving</i>. <s>Interested in to learn</s> невозможно — после предлога инфинитив с to не ставят никогда.',
 examples:[
  ['I enjoy reading in the evening.','Мне нравится читать по вечерам.'],
  ['I want to learn English.','Я хочу выучить английский.'],
  ['She finished working at six.','Она закончила работать в шесть.'],
  ['I\'m interested in learning more.','Мне интересно узнать больше.'],
  ['Do you mind waiting?','Не против подождать?']
 ],
 quiz:[
  {q:'«Я закончила работать»:',o:['I finished to work','I finished working','I finished work to'],a:1,e:'Finish относится к группе глаголов, после которых возможна только форма на -ing. Инфинитив с to после него не употребляется.'},
  {q:'«Мне интересно учить языки»:',o:['I\'m interested in to learn languages','I\'m interested in learning languages','I\'m interested to learning languages'],a:1,e:'После предлога in может стоять только форма на -ing. Это правило действует без исключений, для любого предлога.'},
  {q:'«Я хочу поехать в Италию»:',o:['I want going to Italy','I want to go to Italy','I want go to Italy'],a:1,e:'Want входит в группу глаголов, требующих инфинитива с to. Без частицы to конструкция тоже не собирается.'}
 ]
},
{
 id:'g-usedto', title:'used to', sub:'То, что было раньше и закончилось',
 core:'used to — привычка или состояние в прошлом, которых сейчас нет.',
 why:`В русском эта мысль передаётся словом «раньше» плюс несовершенный вид: «раньше я курила», «раньше здесь был магазин». Английский упаковал её в отдельную конструкцию <b>used to + начальная форма глагола</b>.<br><br>Она сама по себе сообщает, что <b>сейчас это не так</b>. Поэтому <i>I used to live in Moscow</i> означает не только «жила», но и «больше не живу» — второе можно не договаривать.`,
 pairs:[
  ['I <b>used to</b> smoke.','Раньше курила, сейчас нет.'],
  ['I <b>am used to</b> smoke.','Так сказать нельзя — другая конструкция.']
 ],
 pairsNote:'Разница в маленьком be, а смысл меняется полностью.',
 trap:'Не путайте с <b>be used to</b> — «привыкнуть к». После него идёт существительное или форма на -ing: <i>I\'m used to the noise</i>, <i>I\'m used to getting up early</i>. И в вопросах с did конструкция теряет -d: <i>Did you use to live here?</i>',
 examples:[
  ['I used to live in Moscow.','Раньше я жила в Москве.'],
  ['There used to be a shop here.','Раньше здесь был магазин.'],
  ['She didn\'t use to like coffee.','Раньше она не любила кофе.'],
  ['I\'m used to getting up early.','Я привыкла рано вставать.']

/* Быстрый доступ: слово → его формы, и обратно: любая форма → начальная */
const IRREG_MAP = {}, IRREG_BACK = {};
IRREG.forEach(g => g.verbs.forEach(v => {
  IRREG_MAP[v[0]] = {past:v[1], part:v[2], group:g.id, name:g.name};
  if(v[1] !== v[0]) IRREG_BACK[v[1]] = v[0];
  if(v[2] !== v[0] && v[2] !== v[1]) IRREG_BACK[v[2]] = v[0];
}));

/* Правильные глаголы строятся по правилу — его достаточно знать один раз */
const DOUBLE = /^(?:[^aeiou]*[aeiou][bdgklmnprt])$/;
function pastForm(w){
  if(IRREG_MAP[w]) return IRREG_MAP[w].past;
  if(/e$/.test(w)) return w + 'd';
  if(/[^aeiou]y$/.test(w)) return w.slice(0,-1) + 'ied';
  if(DOUBLE.test(w) || /[^aeiou][aeiou]l$/.test(w)) return w + w.slice(-1) + 'ed';
  return w + 'ed';
}
function partForm(w){ return IRREG_MAP[w] ? IRREG_MAP[w].part : pastForm(w); }
function ingForm(w){
  if(/ie$/.test(w)) return w.slice(0,-2) + 'ying';
  if(/[^e]e$/.test(w)) return w.slice(0,-1) + 'ing';
  if(DOUBLE.test(w) || /[^aeiou][aeiou]l$/.test(w)) return w + w.slice(-1) + 'ing';
  return w + 'ing';
}
function sForm(w){
  if(/(s|sh|ch|x|z|o)$/.test(w)) return w + 'es';
  if(/[^aeiou]y$/.test(w)) return w.slice(0,-1) + 'ies';
  return w + 's';
}
function verbForms(w){
  const k = w.toLowerCase();
  if(k === 'be') return {s:'is (am, are)', past:'was / were', part:'been', ing:'being', irregular:true};
  if(k === 'have') return {s:'has', past:'had', part:'had', ing:'having', irregular:true};
  return {s:sForm(k), past:pastForm(k), part:partForm(k), ing:ingForm(k), irregular:!!IRREG_MAP[k]};
}

   Карточка всплывает по ДАТЕ, а не по счётчику дней подряд.

//--SM2-START--
function today(){ return ymd(new Date()); }
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const p=s.split('-').map(Number); return ymd(new Date(p[0],p[1]-1,p[2]+n)); }
function diffDays(a,b){ const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  return Math.round((new Date(pb[0],pb[1]-1,pb[2]) - new Date(pa[0],pa[1]-1,pa[2]))/86400000); }

function newState(){ return {ef:2.5, iv:0, reps:0, lapses:0, due:today()}; }

/* grade: 0 не помню · 1 трудно · 2 нормально · 3 легко
   Возвращает обновлённое состояние. iv===0 означает «показать ещё раз в этой сессии». */
function schedule(st, grade, day){
  day = day || today();
  const s = Object.assign({}, st);
  if(grade === 0){
    s.reps = 0; s.lapses++; s.iv = 0;
    s.ef = Math.max(1.3, s.ef - 0.20);
    s.due = day;
    return s;
  }
  if(grade === 1){
    s.ef = Math.max(1.3, s.ef - 0.15);
    s.reps++;
    s.iv = s.iv < 1 ? 1 : Math.max(1, Math.round(s.iv * 1.2));
  } else if(grade === 2){
    s.reps++;
    s.iv = s.reps === 1 ? 1 : s.reps === 2 ? 3 : Math.round(s.iv * s.ef);
  } else {
    s.ef = Math.min(3.0, s.ef + 0.15);
    s.reps++;
    s.iv = s.reps === 1 ? 3 : s.reps === 2 ? 6 : Math.round(s.iv * s.ef * 1.3);
  }
  s.iv = Math.min(365, Math.max(1, s.iv));
  s.due = addDays(day, s.iv);
  return s;
}
//--SM2-END--

function plural(n, one, few, many){
  const m10 = n%10, m100 = n%100;

function speak(text, slow){
  if(!S.opts.audio) return;

  try{

  return allCards().filter(c=>{
    const st = S.cards[c.id];
    return st && diffDays(st.due, t) >= 0;
  });
}
function newList(){
  return allCards().filter(c => !S.cards[c.id] && (c.deck==='custom' || c.deck==='phrase' || c.deck==='verb' || S.opts.decks[c.deck]));
}
function learnedCount(){
  return Object.values(S.cards).filter(st=>st.reps>=2).length;
}
function poolSize(){
  return allCards().filter(c=>c.deck==='custom'||c.deck==='phrase'||c.deck==='verb'||S.opts.decks[c.deck]).length;
}
function tripLearned(){
  return Object.keys(S.cards).filter(k=>k.indexOf('p:')===0).length;
}

let session = null;
function startSession(limit){
  const due = shuffle(dueList().map(c=>c.id));
  const fresh = newList().slice(0, S.opts.newPerSession).map(c=>c.id);
  let q = [];
  // новые вперемешку с повторениями: новое каждые ~3 карточки
  let fi = 0, di = 0;
  while(fi < fresh.length || di < due.length){
    for(let k=0;k<3 && di<due.length;k++) q.push(due[di++]);
    if(fi < fresh.length) q.push(fresh[fi++]);
  }
  if(limit) q = q.slice(0, limit);
  session = { q, done:0, total:q.length, learned:[], hard:0, easy:0, cloze:null };
  render();
}

function gradeCard(id, grade){
  const st = S.cards[id] || newState();
  const wasLearned = st.reps >= 2;
  const ns = schedule(st, grade);
  S.cards[id] = ns;
  const t = today();
  S.hist[t] = (S.hist[t]||0) + 1;
  session.q.shift();
  session.done++;
  session.cloze = null;
  if(grade <= 1) session.hard++; else session.easy++;
  // момент, когда слово впервые уходит в долгую память — его и стоит показать в финале
  if(!wasLearned && ns.reps >= 2){
    const c = cardById(id);
    if(c) session.learned.push({w:c.w, tr:c.tr, iv:ns.iv});
  }
  if(ns.iv === 0){
    // «не помню» — вернуть в очередь, но не сразу
    const pos = Math.min(session.q.length, 3);
    session.q.splice(pos, 0, id);
    session.total++;
  }
  save();
  render();
}

/* ==========================================================================
   Резервная копия. Весь прогресс лежит в памяти браузера: почистили данные
   сайта — и всё пропало. Файл снимает этот риск.
   ========================================================================== */
function exportProgress(){
  const data = JSON.stringify({app:'quiet-english', version:1, saved:today(), state:S}, null, 1);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'quiet-english-' + today() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function importProgress(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(r.result);
      const st = data && data.state ? data.state : data;
      if(!st || typeof st !== 'object' || !st.cards) throw new Error('не тот файл');
      const n = Object.keys(st.cards).length;
      if(!confirm(`В файле ${n} ${plural(n,'карточка','карточки','карточек')}. Заменить текущий прогресс?`)) return;
      store.set(JSON.stringify(st));
      load(); applyTheme(); render();
      alert('Прогресс восстановлен.');
    }catch(e){
      alert('Не получилось прочитать файл. Нужен тот, который выгрузило это же приложение.');
    }
  };
  r.readAsText(file);
  input.value = '';
}

/* ==========================================================================
   Шеринг-карточка. Рисуется на canvas, чтобы её можно было сохранить
   в галерею или отправить. Никаких чужих картинок — только своя графика.
   ========================================================================== */
function shareCard(kind, en, ru){
  const W = 1080, H = 1350;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const BG = css('--bg') || '#FBF8F2', INK = css('--ink') || '#2B2721',
        INK2 = css('--ink-2') || '#6B6153', ACC = css('--accent') || '#A5522F',
        SURF = css('--surface') || '#FFFFFF', LINE = css('--line') || '#E9E1D2';

  x.fillStyle = BG; x.fillRect(0,0,W,H);
  // пейзаж сверху
  x.fillStyle = '#E6EDF1'; x.fillRect(0,0,W,470);
  x.fillStyle = '#E4B75F'; x.beginPath(); x.arc(820,150,66,0,7); x.fill();
  const hill=(y,col,amp)=>{ x.fillStyle=col; x.beginPath(); x.moveTo(0,y);
    for(let i=0;i<=W;i+=20) x.lineTo(i, y - Math.sin(i/210)*amp - Math.sin(i/95)*amp*0.4);
    x.lineTo(W,470); x.lineTo(0,470); x.closePath(); x.fill(); };
  hill(390,'#B4C6D0',34); hill(424,'#93B29C',26); hill(452,'#587A5F',18);

  // карточка с содержимым
  const pad = 70, top = 400;
  x.fillStyle = SURF; x.strokeStyle = LINE; x.lineWidth = 3;
  const r=40, w=W-pad*2, hh=H-top-pad-90;
  x.beginPath();
  x.moveTo(pad+r,top); x.arcTo(pad+w,top,pad+w,top+hh,r); x.arcTo(pad+w,top+hh,pad,top+hh,r);
  x.arcTo(pad,top+hh,pad,top,r); x.arcTo(pad,top,pad+w,top,r); x.closePath();
  x.fill(); x.stroke();

  const wrap=(text,font,maxW)=>{ x.font=font; const words=String(text).split(' '); const lines=[]; let cur='';
    words.forEach(wd=>{ const t=cur?cur+' '+wd:wd; if(x.measureText(t).width>maxW && cur){lines.push(cur);cur=wd;} else cur=t; });
    if(cur) lines.push(cur); return lines; };

  let y = top + 130;
  x.textAlign = 'center';
  if(kind === 'phrase'){
    x.fillStyle = ACC; x.font = '500 34px -apple-system, sans-serif';
    x.fillText('ФРАЗА ДЛЯ ПОЕЗДКИ', W/2, y - 42);
    x.fillStyle = INK;
    wrap(en, '500 76px Georgia, serif', w-130).forEach(l=>{ x.font='500 76px Georgia, serif'; x.fillText(l, W/2, y); y += 92; });
    y += 24; x.fillStyle = INK2; x.font = '400 40px -apple-system, sans-serif';
    wrap(ru, '400 40px -apple-system, sans-serif', w-130).forEach(l=>{ x.fillText(l, W/2, y); y += 54; });
  } else {
    const got = (session && session.learned) || [];
    x.fillStyle = ACC; x.font = '500 34px -apple-system, sans-serif';
    x.fillText('СЕГОДНЯ ЗАКРЕПИЛОСЬ', W/2, y - 42);
    x.fillStyle = INK; x.font = '500 150px Georgia, serif';
    x.fillText(String(got.length || learnedCount()), W/2, y + 70);
    y += 150;
    x.fillStyle = INK2; x.font = '400 40px -apple-system, sans-serif';
    x.fillText(got.length ? plural(got.length,'слово','слова','слов') + ' ушло в долгую память' : 'слов выучено всего', W/2, y);
    y += 80; x.fillStyle = INK; x.font = '500 52px Georgia, serif';
    got.slice(0,3).forEach(g=>{ x.fillText(g.w, W/2, y); y += 66; });
  }

  x.textAlign = 'center'; x.fillStyle = INK2; x.font = '400 34px -apple-system, sans-serif';
  x.fillText('Quiet English · английский без давления и без вины', W/2, H - 70);

  c.toBlob(async blob=>{
    const file = new File([blob], 'quiet-english.png', {type:'image/png'});
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file]});
        return;
      }
    }catch(e){}
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'quiet-english.png';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
}

/* Группа неправильных глаголов уходит в повторение целиком.
   Карточка спрашивает не значение, а формы — это разные навыки. */
function addVerbGroup(gid){
  const g = IRREG.find(x=>x.id===gid); if(!g) return;
  g.verbs.forEach(v=>{
    const id = 'v:'+v[0];
    if(S.cards[id]) return;
    S.custom[id] = {id:id, deck:'verb', w:v[0], ipa:'', tr:`${v[1]} — ${v[2]}`, pos:'формы глагола',
                    ex:'', exru:'', base:v[0], past:v[1], part:v[2], gloss:v[3]};
    S.cards[id] = newState();
  });
  save(); render();
}

function addScene(sceneId){
  const f = sceneById(sceneId); if(!f) return;
  f.s.say.forEach((p,i)=>{

    if(S.cards[id]) return;
    S.custom[id] = {id:id, deck:'phrase', w:p[0], ipa:'', tr:p[1], pos:'фраза', ex:'', exru:''};
    S.cards[id] = newState();
  });
  save(); render();
}

/* ==========================================================================

   Разделов много, и без порядка непонятно, за что браться. Здесь он задан
   явно: девять шагов, каждый со своей задачей и понятным условием готовности.

function deckLearned(deckId){
  const ids = (DECKS.find(d=>d.id===deckId)||{words:[]}).words.map(w=>w[0].toLowerCase());
  return ids.filter(id => S.cards[id] && S.cards[id].reps >= 2).length;
}
function sceneDone(id){
  const f = sceneById(id);
  return f ? f.s.say.every((_,i)=>S.cards[phraseId(id,i)]) : false;
}
function quizDone(gid){ return !!S.quiz[gid]; }

function pathSteps(){
  const g = id => GRAMMAR.findIndex(x=>x.id===id);
  return [
   {t:'Пять фраз-выручалок', why:'Они превращают любую непонятную ситуацию в решаемую: попросить помощь, попросить написать, попросить говорить медленнее. С них начинают, потому что они снимают страх.',
    goal:'Взять сцену «Просьба о помощи» в карточки', go:`go('trip','help')`, done:sceneDone('help')},

   {t:'Первые 60 глаголов', why:'Половина всей английской речи держится на нескольких десятках глаголов. Пока их нет, любая фраза упирается в потолок.',
    goal:'Выучить хотя бы 30 слов из первой колоды', go:`go('cards');startSession()`, done:deckLearned('v1')>=30,
    prog:`${deckLearned('v1')} из 60`},

   {t:'Как собирается предложение', why:'В английском порядок слов заменяет падежи, а глагол-связка обязателен. Без этих двух правил слова остаются кучей, а не фразой.',
    goal:'Разобрать темы «Порядок слов» и «Глагол to be»', go:`go('gram',${g('g-order')})`, done:quizDone('g-order')&&quizDone('g-be')},

   {t:'Существительные и артикли', why:'Артикли — единственное, чего в русском нет вообще. Разобравшись с ними рано, ты избавляешься от самой заметной ошибки.',
    goal:'50 существительных и тема «Артикли a / the»', go:`go('gram',${g('g-articles')})`, done:deckLearned('n1')>=25&&quizDone('g-articles')},

   {t:'Настоящее время и вопросы', why:'Этого хватает, чтобы говорить о себе и спрашивать других — то есть вести разговор, а не только понимать.',
    goal:'Темы «Present Simple» и «Вопросы и do»', go:`go('gram',${g('g-present')})`, done:quizDone('g-present')&&quizDone('g-do')},

   {t:'Формы глаголов', why:'Слово выучено, но во фразу не встаёт, пока не знаешь его вторую и третью форму. Это шаг, после которого появляется прошедшее время.',
    goal:'Разобрать хотя бы одну группу неправильных глаголов', go:`go('gram','verbs')`,
    done:Object.keys(S.cards).some(k=>k.indexOf('v:')===0)},

   {t:'Прошедшее время', why:'Рассказать, что было вчера или в поездке, — самая частая бытовая задача после «представиться».',
    goal:'Темы «Past Simple» и «Present Perfect»', go:`go('gram',${g('g-past')})`, done:quizDone('g-past')&&quizDone('g-perfect')},

   {t:'Разговорник под поездку', why:'Туристический английский — замкнутый набор ситуаций. Их можно закрыть целиком, в отличие от «языка вообще».',
    goal:'Взять в работу хотя бы три сцены', go:`go('trip')`,
    done:TRIPS.reduce((n,gr)=>n+gr.scenes.filter(sc=>sceneDone(sc.id)).length,0)>=3,
    prog:`${TRIPS.reduce((n,gr)=>n+gr.scenes.filter(sc=>sceneDone(sc.id)).length,0)} из 27`},

   {t:'Чтение каждый день', why:'Дальше язык растёт сам — от объёма прочитанного. Это то место, где обучение перестаёт быть занятиями и становится привычкой.',
