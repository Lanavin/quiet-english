<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiet English — превью экранов</title>
<style>
body{margin:0;background:#EDEDE9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#1A1A18}
.head{max-width:1180px;margin:0 auto;padding:40px 24px 8px}
.head h1{font-family:ui-serif,Georgia,serif;font-weight:500;font-size:28px;margin:0 0 6px}
.head p{color:#6C6C64;margin:0;font-size:15px;max-width:640px;line-height:1.6}
.grid{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:32px}
figure{margin:0}
figcaption{font-size:13px;color:#6C6C64;margin-bottom:10px;letter-spacing:.02em}
.phone{width:100%;max-width:360px;height:720px;border-radius:28px;overflow:hidden;border:1px solid #D6D6CB;background:#FAFAF8;position:relative;box-shadow:0 2px 4px rgba(0,0,0,.04),0 18px 40px -20px rgba(0,0,0,.25)}
.view{height:100%;overflow:auto}
.app nav{position:sticky;bottom:0}

.app /* ==========================================================================
   ДИЗАЙН-СИСТЕМА
   Тёплая светлая база, .app один акцент, .app иерархия размером и весом.
   Шкала отступов кратна 4. Радиусы: 8 / 12 / 16 — и только они.
   ========================================================================== */
.app{
  --bg:#FBF8F2;  --surface:#FFFFFF;  --sunk:#F4EFE4;  --sunk-2:#EDE6D6;
  --ink:#2B2721; --ink-2:#6B6153;    --ink-3:#857C6E;
  --line:#E9E1D2; --line-2:#DDD3BF;

  --accent:#A5522F;      --accent-soft:#F7EAE1;  --accent-line:#EFD9C9;
  --ok:#4E7055;          --ok-soft:#E8EFE7;
  --sky:#416B85;         --sky-soft:#E4EDF2;
  --warn:#8A5F0F;        --warn-soft:#FAF0DA;
  --bad:#9C3E36;         --bad-soft:#F9E7E4;

  --r-s:8px; --r-m:12px; --r-l:16px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --fs:17px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  --serif:ui-serif,"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --shadow:0 1px 2px rgba(26,26,24,.04), 0 8px 24px -12px rgba(26,26,24,.10);
}
.app{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
.app, .app body{margin:0; padding:0}
.app{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.6;
  font-feature-settings:"cv05","ss01"; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
.app .wrap{max-width:600px; margin:0 auto; padding:var(--s6) var(--s5) var(--s2)}
.app /* ---------- типографика ---------- */
h1{font-family:var(--serif); font-size:1.75rem; font-weight:500; line-height:1.22; letter-spacing:-.015em; margin:0 0 var(--s2)}
.app h2{font-size:1.14rem; font-weight:600; letter-spacing:-.01em; margin:var(--s7) 0 var(--s3)}
.app h3{font-size:.78rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin:var(--s6) 0 var(--s3)}
.app p{margin:0 0 var(--s3)}
.app .lead{color:var(--ink-2); font-size:.97rem; line-height:1.55; margin-bottom:var(--s5); max-width:34em}
.app .muted{color:var(--ink-2)}
.app .tiny{font-size:.8rem; line-height:1.5; color:var(--ink-3)}
.app .num{font-family:var(--serif); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.app /* ---------- поверхности ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:var(--s5)}
.app .card + .card{margin-top:var(--s3)}
.app .plain{background:none; border:0; padding:0}
.app .row{display:flex; gap:var(--s3); align-items:center}
.app .row.wrap-r{flex-wrap:wrap}
.app .spacer{flex:1}
.app .stack > * + *{margin-top:var(--s3)}
.app /* ---------- кнопки ---------- */
button{font-family:inherit; font-size:inherit; cursor:pointer; color:inherit}
.app .btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  border-radius:var(--r-m); padding:var(--s3) var(--s4); font-weight:500; font-size:.97rem;
  min-height:50px; transition:background .15s ease, transform .1s ease, border-color .15s ease;
}
.app .btn:hover{background:var(--sunk)}
.app .btn:active{transform:scale(.98)}
.app .btn.primary:active{opacity:.92}
.app .btn.primary{background:var(--ink); border-color:var(--ink); color:var(--bg); font-weight:500}
.app .btn.primary:hover{background:#000}
.app .grade:active{transform:scale(.96)}
.app .grade b{display:block; font-size:.86rem; font-weight:600; line-height:1.25}
.app .grade span{display:block; font-size:.69rem; color:var(--ink-3); line-height:1.35; margin-top:5px}
.app .grade.g0{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.app .grade.g1{background:var(--warn-soft); border-color:transparent; color:var(--warn)}
.app .grade.g2{background:var(--ok-soft); border-color:transparent; color:var(--ok)}
.app .grade.g3{background:var(--sunk); border-color:transparent; color:var(--ink-2)}
.app .grade.g0 span, .app .grade.g1 span, .app .grade.g2 span, .app .grade.g3 span{color:inherit; opacity:.65}
.app /* ---------- нижняя навигация ---------- */
nav{
  position:static; left:0; right:0; bottom:0; z-index:50;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
   
  border-top:1px solid var(--line);
  padding:var(--s2) 0 calc(var(--s1) + env(safe-area-inset-bottom));
  display:flex;
}
.app nav button{
  flex:1; background:none; border:0; color:var(--ink-3);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:var(--s1) 2px; font-size:.63rem; letter-spacing:.01em; transition:color .15s ease;
}
.app nav button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.app nav button.on{color:var(--ink); font-weight:600}
.app nav button.on svg{stroke-width:1.9}
.app nav button::after{content:''; width:4px; height:4px; border-radius:50%; background:transparent; margin-top:1px}
.app nav button.on::after{background:var(--accent)}
.app .badge{
  position:absolute; transform:translate(14px,-5px);
  background:var(--accent); color:#fff; border-radius:9px;
  font-size:.58rem; padding:1px 5px; font-weight:700; min-width:16px; text-align:center; letter-spacing:0;
}
.app .screen{display:none}
.app .screen.on{display:block; animation:in .24s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.app /* ---------- иллюстрации ---------- */
.scene{display:block; width:100%; height:132px}
.app /* Кот не наследует цвета темы: иначе в тёмном режиме он получал светлые
   глаза на тёмной морде и превращался в кота из фильма ужасов.
   Шерсть всегда светлая, .app глаза всегда тёмные — в обеих темах. */
.cat{--fur:#EDE6D6; --fur-line:#DDD3BF; --fur-ink:#2B2721; --fur-pink:#D9A48D; --fur-nose:#C2755C}
.app .arch .inner{padding:var(--s5) var(--s5) var(--s7); text-align:center; margin-top:-30px; position:relative}
.app .arch .cat{margin:0 auto var(--s3); display:block}
.app .hero{padding:0 0 var(--s6)}
.app .hero .kicker{font-size:.78rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s2)}
.app .hero .count{font-family:var(--serif); font-size:3.6rem; line-height:.98; letter-spacing:-.035em; font-variant-numeric:tabular-nums}
.app .hero .unit{font-size:.97rem; color:var(--ink-2); line-height:1.5; margin:var(--s3) auto var(--s5); max-width:19em}
.app .metrics{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s2)}
.app .metrics > div{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-m);
  padding:var(--s4) var(--s2); text-align:center}
.app .metrics b{display:block; font-family:var(--serif); font-size:1.55rem; font-weight:500; letter-spacing:-.02em;
  font-variant-numeric:tabular-nums; line-height:1.1; margin-bottom:6px}
.app .metrics span{display:block; font-size:.73rem; color:var(--ink-3); line-height:1.35}
.app .bar{height:5px; border-radius:3px; background:var(--sunk); overflow:hidden}
.app .bar i{display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .5s cubic-bezier(.2,.7,.3,1)}
.app .spark{display:flex; gap:3px; align-items:flex-end; height:38px}
.app .spark div{flex:1; border-radius:2px; background:var(--accent); min-height:4px}
.app /* ---------- списки ---------- */
.list{border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden; background:var(--surface)}
.app .list-item{
  display:flex; align-items:center; gap:var(--s3); padding:var(--s4);
  border:0; border-bottom:1px solid var(--line); background:var(--surface);
  width:100%; text-align:left; min-height:60px; transition:background .15s ease;
}
.app .list-item:last-child{border-bottom:0}
.app .list-item:hover{background:var(--sunk)}
.app .list-item .ttl{display:block; font-weight:500; font-size:.97rem; line-height:1.4}
.app .list-item .sub{display:block; font-size:.8rem; color:var(--ink-3); line-height:1.45; margin-top:3px}
.app .chev{color:var(--line-2); flex:none; font-size:1.15rem; line-height:1; transition:color .15s ease, transform .15s ease}
.app .list-item:hover .chev{color:var(--ink-3); transform:translateX(2px)}
.app .dot{width:7px; height:7px; border-radius:50%; background:var(--line-2); flex:none}
.app .dot.done{background:var(--ok)}
.app /* ---------- карточка слова ---------- */
.flip{perspective:1400px; cursor:pointer}
.app .flip-inner{
  display:grid; transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.2,.75,.25,1);
}
.app .flip.flipped .flip-inner{transform:rotateY(180deg)}
.app .flip-inner > .face{grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.app .flip-inner > .face.back{transform:rotateY(180deg)}
.app .face{
  background:var(--surface); border:1px solid var(--line); border-radius:20px;
  padding:var(--s7) var(--s5); text-align:center; box-shadow:var(--shadow);
  display:flex; flex-direction:column; justify-content:center; min-height:320px;
}
.app .face.front .term{margin-top:var(--s2)}
@media (prefers-reduced-motion: reduce){
  .flip-inner{transition:none}
.app .screen.on{animation:none}
}
.app .term{font-family:var(--serif); font-size:2.7rem; font-weight:500; letter-spacing:-.02em; line-height:1.2;
  overflow-wrap:anywhere; hyphens:auto}
.app .ipa{font-size:1.15rem; color:var(--accent); margin-top:var(--s2); font-family:var(--sans); letter-spacing:.01em}
.app .ask{font-size:.76rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s4)}
.app .divider{height:1px; background:var(--line); margin:var(--s5) auto; max-width:56px}
.app .meaning{font-size:1.4rem; line-height:1.35}
.app .pos{display:block; font-size:.74rem; letter-spacing:.05em; color:var(--ink-3); margin-top:var(--s2)}
.app /* ---------- формы глагола ---------- */
.forms{background:var(--sunk); border-radius:var(--r-m); padding:var(--s4); margin-top:var(--s5); text-align:left}
.app .forms.irr{background:var(--accent-soft)}
.app .forms-hd{font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s3)}
.app .forms.irr .forms-hd{color:var(--accent)}
.app .forms-list{display:grid; gap:1px; background:var(--line); border-radius:var(--r-s); overflow:hidden}
.app .frow{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4);
  background:var(--sunk); padding:var(--s3) var(--s4)}
.app .forms.irr .frow{background:var(--accent-soft)}
.app .frow i{font-style:normal; font-size:.8rem; color:var(--ink-2); line-height:1.4}
.app .frow b{font-weight:500; font-size:1.05rem; white-space:nowrap}
.app .frow b.key{font-weight:700; color:var(--accent)}
.app .forms.irr .frow i{color:var(--ink-2)}
.app .forms-row{display:flex; flex-wrap:wrap; gap:var(--s3) var(--s4)}
.app .forms-row span{display:flex; flex-direction:column; font-size:.98rem; line-height:1.35}
.app .forms-row i{font-style:normal; font-size:.66rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px}
.app .forms-row b{font-weight:600}
.app .forms-note{font-size:.76rem; line-height:1.45; color:var(--ink-2); margin-top:var(--s3)}
.app .vcard{display:grid; gap:var(--s3); max-width:280px; margin:0 auto; text-align:left}
.app .vcard > div{display:flex; align-items:baseline; justify-content:space-between; gap:var(--s4);
  padding-bottom:var(--s2); border-bottom:1px solid var(--line)}
.app .vcard i{font-style:normal; font-size:.72rem; letter-spacing:.04em; color:var(--ink-3)}
.app .vcard b{font-family:var(--serif); font-size:1.5rem; font-weight:500}
.app .vtable{border:1px solid var(--line); border-radius:var(--r-m); overflow:hidden; background:var(--surface)}
.app .vhead{display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--s2); padding:var(--s3) var(--s4);
  background:var(--sunk); font-size:.68rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3)}
.app .vrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:var(--s2) var(--s2);
  padding:var(--s3) var(--s4); border-top:1px solid var(--line); font-size:.98rem; align-items:baseline}
.app .vrow .v1{font-weight:600}
.app .vrow .vru{grid-column:1 / -1; font-size:.78rem; color:var(--ink-3); margin-top:-2px}
.app .example{background:var(--sunk); border-radius:var(--r-m); padding:var(--s4); margin-top:var(--s5); text-align:left}
.app .example .lbl{font-size:.7rem; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); margin-bottom:var(--s2)}
.app .example .en{font-size:1rem; line-height:1.55}
.app .example .ru{font-size:.86rem; color:var(--ink-2); line-height:1.45; margin-top:6px}
.app .speak{
  border:1px solid var(--line-2); background:var(--surface); border-radius:99px;
  padding:7px 14px; font-size:.78rem; color:var(--ink-2); display:inline-flex; gap:6px; align-items:center; min-height:36px;
}
.app .speak:hover{background:var(--sunk)}
.app .speak svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app /* ---------- грамматика ---------- */
.note{border-radius:0 var(--r-m) var(--r-m) 0; padding:var(--s4) var(--s5);
  margin:var(--s4) 0; font-size:.95rem; line-height:1.65; border-left:3px solid var(--line-2)}
.app .note.why{background:var(--sunk); border-left-color:var(--ink-3)}
.app .note.trap{background:var(--warn-soft); color:#5C4210; border-left-color:var(--warn)}
.app .opt:hover:not(:disabled){background:var(--sunk)}
.app .opt.correct{background:var(--ok-soft); border-color:transparent; color:var(--ok); font-weight:600}
.app .opt.wrong{background:var(--bad-soft); border-color:transparent; color:var(--bad)}
.app .opt:disabled{cursor:default}
.app .exline{padding:var(--s3) 0; border-bottom:1px solid var(--line)}
.app .exline:last-child{border-bottom:0}
.app /* ---------- звуки ---------- */
.mouth{width:100%; max-width:320px; margin:0 auto; display:block}
.app .mouth .head{fill:var(--sunk); stroke:var(--ink-3); stroke-width:2.2; stroke-linejoin:round}
.app .mouth .cav{fill:var(--surface); stroke:var(--ink-3); stroke-width:1.8; stroke-linejoin:round}
.app .mouth .nasal{fill:var(--bg); stroke:var(--line-2); stroke-width:1.5}
.app .mouth .teeth{fill:var(--surface); stroke:var(--ink-2); stroke-width:1.6; stroke-linejoin:round}
.app .mouth .tongue{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2.6; stroke-linejoin:round}
.app .mouth .air{fill:none; stroke:var(--warn); stroke-width:2.6; stroke-dasharray:7 5; stroke-linecap:round}
.app .mouth .vox{fill:none; stroke:var(--accent); stroke-width:2.4; stroke-linecap:round}
.app .mouth .lbl{fill:var(--ink-3); font-size:11px; font-family:inherit}
.app .mouth .lblA{fill:var(--accent); font-size:11px; font-family:inherit; font-weight:600}
.app .mouth .lipsF{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2.6; stroke-linejoin:round}
.app .mouth .gap{fill:var(--ink)}
.app .mouth .thF{fill:var(--surface); stroke:var(--ink-2); stroke-width:1.4}
.app .mouth .tgF{fill:var(--accent-soft); stroke:var(--accent); stroke-width:2}
.app .sound-hd{display:flex; align-items:baseline; gap:var(--s4); flex-wrap:wrap; margin-bottom:var(--s1)}
.app .sound-hd .sym{font-family:var(--serif); font-size:2.4rem; color:var(--accent); line-height:1}
.app .step{display:flex; align-items:flex-start; gap:var(--s4); padding:var(--s3) 0; line-height:1.55}
.app .step i{flex:none; width:24px; height:24px; border-radius:50%; background:var(--sunk); color:var(--ink-2);
  display:grid; place-items:center; font-size:.72rem; font-weight:700; font-style:normal; margin-top:2px}
.app .minpair{display:flex; align-items:center; gap:var(--s4); padding:var(--s4) 0; border-bottom:1px solid var(--line)}
.app .minpair:last-child{border-bottom:0}
.app /* ---------- чтение ---------- */
.text-body{font-size:1.06rem; line-height:1.85}
.app .w{border-bottom:1px dotted var(--line-2); cursor:pointer; padding:0 1px; transition:background .12s ease}
.app .w:hover{background:var(--accent-soft); border-bottom-color:var(--accent)}
.app .w.known{border-bottom-color:transparent}
.app .pop{
  position:static; left:var(--s3); right:var(--s3); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:60;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:var(--s5);
  box-shadow:0 16px 48px -12px rgba(26,26,24,.22); max-width:520px; margin:0 auto; display:none;
}
.app .pop.on{display:block; animation:in .2s cubic-bezier(.2,.7,.3,1)}
.app /* ---------- разговорник ---------- */
.phrase{border-bottom:1px solid var(--line); padding:var(--s4) 0}
.app .phrase:last-child{border-bottom:0}
.app .phrase.hear{opacity:.92}
.app .phrase .en{font-size:1.03rem; line-height:1.55}
.app .phrase.hear .en{color:var(--ink-2)}
.app .phrase .ru{font-size:.86rem; color:var(--ink-3); line-height:1.45; margin-top:5px}
.app .phrase .acts{display:flex; gap:var(--s2) var(--s2); margin-top:var(--s3); flex-wrap:wrap}
.app .mini{
  border:1px solid var(--line-2); background:var(--surface); border-radius:99px;
  padding:7px 13px; font-size:.76rem; color:var(--ink-2);
  display:inline-flex; gap:5px; align-items:center; min-height:38px;
}
.app .mini:hover{background:var(--sunk)}
.app .mini svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app .mini.on{background:var(--ok-soft); border-color:transparent; color:var(--ok); font-weight:600}
.app .sec-hd{font-size:.76rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin:var(--s7) 0 var(--s2)}
.app .big{position:static; inset:0; z-index:200; background:var(--bg); display:none; padding:var(--s6); overflow:auto}
.app .big.on{display:flex; flex-direction:column; justify-content:center; animation:in .2s ease}
.app .big .txt{font-family:var(--serif); font-size:clamp(2rem,8vw,3.3rem); font-weight:500; line-height:1.2; letter-spacing:-.02em; text-align:center}
.app .big .sub{font-size:1rem; color:var(--ink-2); text-align:center; margin-top:var(--s5)}
.app .big .hint{position:static; left:0; right:0; bottom:calc(var(--s6) + env(safe-area-inset-bottom)); text-align:center; font-size:.76rem; color:var(--ink-3)}
.app /* ---------- доля знакомых слов ---------- */
.know{flex:none; font-size:.78rem; font-weight:600; padding:3px 9px; border-radius:99px;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.app .know.ok{background:var(--ok-soft); color:var(--ok)}
.app .know.mid{background:var(--warn-soft); color:var(--warn)}
.app .know.hard{background:var(--sunk); color:var(--ink-3)}
.app /* ---------- личная подсказка к слову ---------- */
.note-card{background:var(--sunk); border-radius:var(--r-m); padding:var(--s4); margin-top:var(--s4); text-align:left}
.app .note-card.leech{background:var(--bad-soft)}

  <h1>Артикли a / the</h1>
  <p class="lead">Единственная тема, которой нет в русском вообще</p>
  <p style="font-size:1.06rem; font-weight:500; line-height:1.5">Артикль отвечает на вопрос: слушатель уже знает, о каком именно предмете речь?</p>

  <h2>Почему так</h2>
  <div class="note why">В русском мы передаём эту информацию порядком слов и интонацией: «В комнату вошла <u>женщина</u>» (новая, впервые) против «<u>Женщина</u> вошла в комнату» (та самая, известная). Английский порядок слов жёсткий, ему нужен отдельный маркер — им и стал артикль.<br><br><b>a/an</b> = «один из многих, ты его пока не знаешь».<br><b>the</b> = «тот самый, мы оба понимаем какой».<br><b>без артикля</b> = про категорию вообще или про неисчисляемое.</div>

  <h2>Сравни</h2>
  <div class="pair"><div class="no">I need <b>a</b> doctor.</div><div class="yes">Мне нужен какой-нибудь врач.</div></div><div class="pair"><div class="no">I need <b>the</b> doctor.</div><div class="yes">Мне нужен тот самый врач.</div></div>
  <p class="tiny" style="margin-top:var(--s3)">Первую фразу говорят, когда стало плохо. Вторую — когда врач уже есть, и он нужен именно этот.</p>

  <h2>Где ошибаются</h2>
  <div class="note trap"><b>Ловушка. </b>Самая частая ошибка русских — пропускать артикль вообще. Для англоговорящего <s>I bought car</s> звучит примерно как «я купила автомобиль-в-принципе». Правило-костыль на первое время: перед исчисляемым существительным в единственном числе <b>всегда</b> что-то стоит — a, the, my, this, one. Голым оно не бывает.</div>

  <h2>Примеры</h2>
  <div class="exline">
      <div>I saw a cat. The cat was black. <button class="speak" style="padding:3px 9px;font-size:.7rem;min-height:0;vertical-align:middle" onclick="speak(&quot;I saw a cat. The cat was black.&quot;,1)"><svg viewBox="0 0 24 24"><path d="M4 15V9h3.5L12 5.5v13L7.5 15z"></path><path d="M15 10.5a3 3 0 0 1 0 3"></path><path d="M18 8a6 6 0 0 1 0 8"></path></svg></button></div>
      <div class="tiny">Я видела кошку. Кошка была чёрная.</div></div><div class="exline">
      <div>Close the door, please. <button class="speak" style="padding:3px 9px;font-size:.7rem;min-height:0;vertical-align:middle" onclick="speak(&quot;Close the door, please.&quot;,1)"><svg viewBox="0 0 24 24"><path d="M4 15V9h3.5L12 5.5v13L7.5 15z"></path><path d="M15 10.5a3 3 0 0 1 0 3"></path><path d="M18 8a6 6 0 0 1 0 8"></path></svg></button></div>
      <div class="tiny">Закрой дверь, пожалуйста. (мы оба знаем какую)</div></div><div class="exline">
      <div>I love music. <button class="speak" style="padding:3px 9px;font-size:.7rem;min-height:0;vertical-align:middle" onclick="speak(&quot;I love music.&quot;,1)"><svg viewBox="0 0 24 24"><path d="M4 15V9h3.5L12 5.5v13L7.5 15z"></path><path d="M15 10.5a3 3 0 0 1 0 3"></path><path d="M18 8a6 6 0 0 1 0 8"></path></svg></button></div>
      <div class="tiny">Я люблю музыку. (вообще, как явление)</div></div><div class="exline">
      <div>She is a teacher. <button class="speak" style="padding:3px 9px;font-size:.7rem;min-height:0;vertical-align:middle" onclick="speak(&quot;She is a teacher.&quot;,1)"><svg viewBox="0 0 24 24"><path d="M4 15V9h3.5L12 5.5v13L7.5 15z"></path><path d="M15 10.5a3 3 0 0 1 0 3"></path><path d="M18 8a6 6 0 0 1 0 8"></path></svg></button></div>
      <div class="tiny">Она учительница. (одна из)</div></div>

  <h2>Проверь себя</h2>

    <div class="tiny" style="margin-bottom:var(--s2)">Вопрос 1 из 3</div>

  <div class="sound-hd"><span class="sym">θ</span><h1 style="margin:0">глухой th</h1></div>
  <p class="lead">think, three, month, health, both</p>

  <h2>Что делает язык</h2>
  <div class="card" style="padding:var(--s4)"><svg class="mouth" viewBox="0 0 300 218" role="img" aria-label="Положение языка, разрез сбоку">
  
<path class="head" d="M150 6 C104 8 72 24 64 46 L54 58 L18 92 L50 101

  C190 97 170 91 150 89 C110 85 70 92 42 100 Z"></path>
<path class="cav" d="M57 110 C82 100 124 95 156 97 C180 99 194 108 197 126

    <p class="tiny" style="text-align:center;margin:var(--s2) 0 0">Разрез сбоку, лицом влево. Белое — полость рта, цветное — язык.</p>
  </div>

  <h2>Как это выглядит снаружи</h2>
  <div class="card" style="padding:var(--s4)"><svg class="mouth" viewBox="0 0 220 150" role="img" aria-label="Рот спереди">
  <path class="lipsF" d="M10 72 C36 52 74 42 98 56 C104 60 116 60 122 56 C146 42 184 52 210 72 C184 98 148 112 110 112 C72 112 36 98 10 72 Z"></path><ellipse class="gap" cx="110" cy="72" rx="44" ry="9"></ellipse><path class="thF" d="M75.68 64 H144.32 V71.1 H75.68 Z"></path><path class="tgF" d="M84 80 Q110 54 136 80 Z"></path></svg>
    <p class="tiny" style="margin:var(--s3) 0 0">Самый заметный английский звук снаружи: кончик языка виден между зубами. Если ты видишь язык — это th. В русском такого нет ни в одном звуке, поэтому спутать не с чем.</p>
  </div>

  <h2>Как произнести</h2>
  <div class="step"><i>1</i><span>Кончик языка положи между зубами — слегка, чтобы он был виден.</span></div><div class="step"><i>2</i><span>Голос не включай. Просто выдувай воздух в щель между языком и верхними зубами.</span></div><div class="step"><i>3</i><span>Получается длинный шипящий выдох, похожий на «с», но глуше и мягче.</span></div>

  <div class="note trap"><b>Ловушка. </b>Русский мозг подменяет θ на «с» (sink вместо think) или на «ф» (free вместо three). Оба варианта носитель слышит как ошибку. Контроль без слуха: проверь пальцем — язык должен касаться его между зубами.</div>

  <h2>Минимальные пары</h2>
  <p class="tiny" style="margin-top:calc(var(--s3) * -1)">Слова, которые отличаются только этим звуком. Читай их парами перед зеркалом — картинка рта должна отличаться.</p>

    </div><div class="minpair">
      <span style="flex:1;font-weight:500">mouth</span>

    </div><div class="minpair">
      <span style="flex:1;font-weight:500">thin</span>

  <h1>Путь</h1>
  <p class="lead">Порядок, в котором стоит идти. Он не обязательный — но если непонятно, за что браться, берись за ближайший невыполненный шаг.</p>

  </div>
  <div class="bar" style="margin-bottom:var(--s6)"><i style="width:11%"></i></div>

  <div class="path">
    
      <div class="pstep  now">
        <div class="pmark">1</div>
        <div class="pbody">
          <div class="ptitle">Пять фраз-выручалок<span class="pnow">вы здесь</span></div>
          <p class="tiny" style="margin:var(--s2) 0">Они превращают любую непонятную ситуацию в решаемую: попросить помощь, попросить написать, попросить говорить медленнее. С них начинают, потому что они снимают страх.</p>
          <div class="pgoal">Взять сцену «Просьба о помощи» в карточки</div>
          <button class="btn primary" style="margin-top:var(--s3);min-height:44px;padding:var(--s2) var(--s4);font-size:.9rem" onclick="go('trip','help')">Перейти</button>
        </div>
      </div>
      <div class="pstep done ">
        <div class="pmark">✓</div>
        <div class="pbody">
          <div class="ptitle">Первые 60 глаголов</div>
          <p class="tiny" style="margin:var(--s2) 0">Половина всей английской речи держится на нескольких десятках глаголов. Пока их нет, любая фраза упирается в потолок.</p>
          <div class="pgoal">Выучить хотя бы 30 слов из первой колоды · <b>60 из 60</b></div>
          
        </div>
      </div>
      <div class="pstep  ">
        <div class="pmark">3</div>
        <div class="pbody">
          <div class="ptitle">Как собирается предложение</div>
          <p class="tiny" style="margin:var(--s2) 0">В английском порядок слов заменяет падежи, а глагол-связка обязателен. Без этих двух правил слова остаются кучей, а не фразой.</p>
          <div class="pgoal">Разобрать темы «Порядок слов» и «Глагол to be»</div>
          <button class="btn " style="margin-top:var(--s3);min-height:44px;padding:var(--s2) var(--s4);font-size:.9rem" onclick="go('gram',0)">Перейти</button>
        </div>
      </div>
      <div class="pstep  ">
        <div class="pmark">4</div>
        <div class="pbody">
          <div class="ptitle">Существительные и артикли</div>
          <p class="tiny" style="margin:var(--s2) 0">Артикли — единственное, чего в русском нет вообще. Разобравшись с ними рано, ты избавляешься от самой заметной ошибки.</p>
          <div class="pgoal">50 существительных и тема «Артикли a / the»</div>
          <button class="btn " style="margin-top:var(--s3);min-height:44px;padding:var(--s2) var(--s4);font-size:.9rem" onclick="go('gram',2)">Перейти</button>
        </div>
      </div>
      <div class="pstep  ">
        <div class="pmark">5</div>
        <div class="pbody">
          <div class="ptitle">Настоящее время и вопросы</div>
          <p class="tiny" style="margin:var(--s2) 0">Этого хватает, чтобы говорить о себе и спрашивать других — то есть вести разговор, а не только понимать.</p>
          <div class="pgoal">Темы «Present Simple» и «Вопросы и do»</div>
          <button class="btn " style="margin-top:var(--s3);min-height:44px;padding:var(--s2) var(--s4);font-size:.9rem" onclick="go('gram',3)">Перейти</button>
        </div>
      </div>
      <div class="pstep  ">
        <div class="pmark">6</div>
        <div class="pbody">
          <div class="ptitle">Формы глаголов</div>
          <p class="tiny" style="margin:var(--s2) 0">Слово выучено, но во фразу не встаёт, пока не знаешь его вторую и третью форму. Это шаг, после которого появляется прошедшее время.</p>
          <div class="pgoal">Разобрать хотя бы одну группу неправильных глаголов</div>
          <button class="btn " style="margin-top:var(--s3);min-height:44px;padding:var(--s2) var(--s4);font-size:.9rem" onclick="go('gram','verbs')">Перейти</button>
        </div>
      </div>
      <div class="pstep  ">
        <div class="pmark">7</div>
        <div class="pbody">
          <div class="ptitle">Прошедшее время</div>
          <p class="tiny" style="margin:var(--s2) 0">Рассказать, что было вчера или в поездке, — самая частая бытовая задача после «представиться».</p>
          <div class="pgoal">Темы «Past Simple» и «Present Perfect»</div>
          <button class="btn " style="margin-top:var(--s3);min-height:44px;padding:var(--s2) var(--s4);font-size:.9rem" onclick="go('gram',5)">Перейти</button>
        </div>
      </div>
      <div class="pstep  ">
        <div class="pmark">8</div>
        <div class="pbody">
          <div class="ptitle">Разговорник под поездку</div>
          <p class="tiny" style="margin:var(--s2) 0">Туристический английский — замкнутый набор ситуаций. Их можно закрыть целиком, в отличие от «языка вообще».</p>

          <button class="btn " style="margin-top:var(--s3);min-height:44px;padding:var(--s2) var(--s4);font-size:.9rem" onclick="go('trip')">Перейти</button>

      </div>

        </div>
      </div>

  <h1>Как это устроено</h1>
  <p class="lead">Приложение работает не так, как большинство языковых сервисов. Разница в одном: оно рассчитывает, когда ты забудешь слово, и показывает его прямо перед этим.</p>

  <h2>Четыре кнопки под карточкой</h2>
  <p>Это не оценка тебя — это сообщение алгоритму, через сколько дней слово стоит показать снова. Отвечать надо честно: завысишь — забудешь, занизишь — будешь видеть одно и то же.</p>
  <div class="forms-list" style="margin-top:var(--s4)">
    <div class="frow"><i>Не помню</i><b>вернётся сегодня</b></div>
    <div class="frow"><i>Трудно</i><b>интервал почти не растёт</b></div>
    <div class="frow"><i>Нормально</i><b>интервал растёт как обычно</b></div>
    <div class="frow"><i>Легко</i><b>интервал растёт быстрее</b></div>
  </div>

  <h2>Откуда берутся интервалы</h2>
  <p>Память теряет новое не постепенно, а рывком: большая часть выученного уходит в первые сутки. Но каждое возвращение к слову делает эту кривую положе. Поэтому повторять важнее <b>вовремя</b>, чем часто.</p>
  <p>Алгоритм ведёт для каждого слова свой счёт: сначала показывает через день, потом через три, потом через неделю, месяц, полгода. Если слово даётся тяжело, интервал сокращается автоматически.</p>

  <h2>Что значит «выучено»</h2>
  <p>Слово попадает в этот счётчик после двух успешных повторений подряд. Это не значит, что ты знаешь его навсегда, — это значит, что оно ушло в долгую очередь и вернётся нескоро.</p>

  <h2>Почему нет счётчика дней подряд</h2>
  <p>Потому что он мотивирует не учиться, а не терять цифру. Пропустила день — цифра сгорела — смысл продолжать пропал. Здесь пропуск не наказывается ничем: карточки просто дождутся, очередь будет длиннее, а выученное останется выученным.</p>

  <h2>Зачем транскрипция</h2>
  <p>Английское написание почти не связано с произношением: <i>through</i>, <i>though</i>, <i>tough</i> читаются по-разному. Угадывать бесполезно, поэтому у каждого слова стоит запись звучания в международном алфавите. Он читается за один вечер и дальше работает всю жизнь.</p>

  <h2>В обе стороны</h2>
  <p>Карточка иногда спрашивает «что значит это слово», а иногда «как это по-английски». Первое тренирует понимание, второе — способность вспомнить слово в разговоре. Это разные навыки, и второй важнее для речи.</p>

  <h2>Свои слова</h2>
  <p>Любое слово из текста можно тапнуть и добавить в карточки. Слова, которые ты выбрала сама, запоминаются заметно лучше выданных — просто потому, что встретились в живом тексте, а не в списке.</p>

    <h1>Формы глаголов</h1>
    <p class="lead">Выучить слово мало: чтобы построить фразу, глагол надо уметь поставить в нужную форму.</p>
    <div class="note why">
      У английского глагола пять рабочих форм. Четыре из них строятся по правилу и учить их не нужно —
      достаточно знать правило. А вот <b>76 глаголов</b> меняются не по правилу, и это как раз самые
      частые слова языка. Их придётся знать наизусть, но не по алфавиту: ниже они разложены по образцам
      изменения, и внутри группы форма угадывается.
    </div>

    <h2>Правило для остальных</h2>
    <div class="forms">
      <div class="forms-list">
        <div class="frow"><i>I, you, we, they</i><b>work</b></div>
        <div class="frow"><i>he, she, it</i><b>works</b></div>
        <div class="frow"><i>вчера</i><b class="key">worked</b></div>
        <div class="frow"><i>I have…, it was…</i><b class="key">worked</b></div>
        <div class="frow"><i>сейчас, в процессе</i><b>working</b></div>
      </div>
    </div>
    <p class="tiny" style="margin-top:var(--s3)">Три уточнения к правилу: после -e добавляется только -d (like → liked);
    согласная плюс -y даёт -ied (study → studied); короткое слово с одной гласной удваивает последнюю букву (stop → stopped).</p>

    
      <h2>Все три формы одинаковые</h2>
      <p class="tiny" style="margin:calc(var(--s2) * -1) 0 var(--s3)">Самая лёгкая группа: учить нечего, форма одна на все времена.</p>

      <p class="tiny" style="margin:calc(var(--s2) * -1) 0 var(--s3)">Учить придётся целиком, зато это самые частые глаголы языка.</p>

  <div class="phone"><div class="view app"><div class="wrap">
  <div id="home-body">
    <h1>Quiet English</h1>
    <p class="lead">Коротко о том, как это работает. Тридцать секунд — и можно начинать.</p>
    <div class="step" style="padding:var(--s4) 0;border-bottom:1px solid var(--line)">
        <i>1</i>
        <span><span style="font-weight:500">Здесь ничего не сгорает</span><div class="tiny" style="margin-top:2px">Нет счётчика дней подряд, нет сердечек, нет наград за регулярность. Приложение само считает, когда слово пора повторить, и если ты придёшь через две недели, просто покажет его позже. Вина — плохой мотиватор, поэтому её тут нет.</div></span>
      </div><div class="step" style="padding:var(--s4) 0;border-bottom:1px solid var(--line)">
        <i>2</i>
        <span><span style="font-weight:500">Чтение важнее аудирования</span><div class="tiny" style="margin-top:2px">Глазами язык набирается быстрее и надёжнее, чем на слух: можно остановиться, перечитать, подумать. Озвучка есть везде, но она необязательна и никогда не блокирует прогресс.</div></span>
      </div><div class="step" style="padding:var(--s4) 0;border-bottom:1px solid var(--line)">
        <i>3</i>
        <span><span style="font-weight:500">У каждого слова есть транскрипция</span><div class="tiny" style="margin-top:2px">Английское написание почти не связано с произношением, поэтому угадывать бесполезно. IPA — это точная запись звука, и она читается за один вечер.</div></span>
      </div><div class="step" style="padding:var(--s4) 0;border-bottom:1px solid var(--line)">
        <i>4</i>
        <span><span style="font-weight:500">Грамматика объясняет «почему»</span><div class="tiny" style="margin-top:2px">Не «запомни правило», а «вот чем русский устроен иначе и откуда берётся ошибка». Так правила держатся в голове без зубрёжки.</div></span>
      </div><div class="step" style="padding:var(--s4) 0;border-bottom:1px solid var(--line)">
        <i>5</i>
        <span><span style="font-weight:500">Есть готовый маршрут</span><div class="tiny" style="margin-top:2px">Разделов много, и легко растеряться. На главной есть «Путь» — девять шагов в разумном порядке, от первых фраз-выручалок до чтения. Шаги отмечаются сами, вести ничего вручную не нужно.</div></span>
      </div>

    </div>
